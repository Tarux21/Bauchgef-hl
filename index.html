"haferriegel":["Barres avoine-banane",["Préchauffer le four à 180 °C, chemiser un petit moule de papier cuisson.","Écraser les bananes et les mélanger avec tous les autres ingrédients.","Tasser fermement dans le moule et cuire 20 minutes.","Laisser refroidir et couper en 8 barres."],"Congeler : congeler les barres une par une et les emporter congelées le matin.",""],
"fruehstueckswrap":["Wrap fromage frais-jambon à emporter",["Tartiner les wraps de fromage frais.","Garnir de jambon, de lanières de poivron et de salade lavée.","Rouler serré et envelopper dans du papier sulfurisé."],"Transporter au frais et manger avant midi.",""],
"fruehstueckskekse":["Cookies du petit-déjeuner avoine-pomme",["Préchauffer le four à 180 °C.","Écraser la banane, râper la pomme, mélanger avec l'œuf, les flocons d'avoine, les raisins secs, la cannelle et la levure.","Déposer 10 petits tas sur la plaque, aplatir et cuire 15 minutes."],"Deux cookies et un yaourt font un petit-déjeuner à emporter. Se congèlent bien.",""],
"joghurtglas":["Verrine yaourt, pomme et granola",["Couper la pomme en dés.","Alterner yaourt, pomme, flocons d'avoine et graines dans deux bocaux à vis, arroser de miel.","Emporter au frais."],"Encore meilleur avec le granola croustillant des recettes.",""],
"zwiebackbrei":["Bouillie de biscottes à la banane",["Chauffer le lait.","Y émietter les biscottes et laisser gonfler brièvement.","Mélanger avec la banane écrasée."],"Douce, chaude et digeste. Manger de petites portions.",""],
"haferschleim":["Crème d'avoine douce à la pomme râpée",["Porter les flocons d'avoine à ébullition avec le lait et remuer 5 minutes à feu doux jusqu'à ce que ce soit onctueux.","Râper finement la pomme et l'incorporer.","Manger tiède, avec un peu de miel."],"Très doux. Tiède, souvent mieux toléré que chaud.",""],

}); };

/* ============================================================
   DATUM & SSW
   ============================================================ */
function todayISO(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(iso){ const [y,m,d]=iso.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); }
function isoFromNum(n){ const d=new Date(n*864e5); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
function fmtDate(iso){ const [y,m,d]=iso.split("-"); return S.lang==="fr" ? d+"/"+m+"/"+y : d+"."+m+"."+y; }
function pregnancy(){
  if(!S.et) return null;
  const pd = 280 - (dayNum(S.et) - dayNum(todayISO()));
  const w = Math.floor(pd/7), d = pd - w*7;
  const tri = pd < 98 ? 1 : pd < 196 ? 2 : 3;
  return {pd, w, d, tri, left: dayNum(S.et) - dayNum(todayISO())};
}

function fmtNum(x){ const r = Math.round(x*100)/100; return String(r).replace(".",","); }
function scaleAmount(q,u,factor){
  let v = q*factor;
  if(["Stk","Dose","Zehe","Scheibe","Bund","Blatt"].includes(u)) v = Math.ceil(v*2)/2;
  else if(u==="g"||u==="ml") v = Math.round(v/5)*5;
  return v;
}

/* ---------- Tagesziel: Ring fürs Trinken (außen) und Supplements (innen) mit Baby ---------- */
function dayStats(iso){
  const w = S.water[iso] || 0, taken = (S.taken[iso] || []).filter(n => S.suppList.some(x => x.name===n));
  const n = S.suppList.length;
  return {w, wf: Math.min(1, w / S.waterGoal), taken, tf: n ? taken.length / n : 1, n};
}
const dayDone = st => st.wf >= 1 && st.tf >= 1;
function streak(){
  let k = 0, d = dayNum(todayISO());
  if(dayDone(dayStats(isoFromNum(d)))) k++;
  for(d = d-1; k < 400; d--){ if(dayDone(dayStats(isoFromNum(d)))) k++; else break; }
  return k;
}
function ringSVG(wf, tf, size, withFace, mood){
  const r1 = 92, r2 = 70, C1 = 2*Math.PI*r1, C2 = 2*Math.PI*r2, sw = withFace ? 16 : 20;
  const arc = (r, C, f, cls) => `<circle cx="120" cy="120" r="${r}" class="${cls}-bg" fill="none" stroke-width="${sw}"/><circle cx="120" cy="120" r="${r}" class="${cls}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(Math.max(.001,f)*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 120 120)"/>`;
  let face = "";
  if(withFace){
    const m = mood, eye = m < .34
      ? `<path d="M102 116q5 4 10 0M128 116q5 4 10 0" class="f-line" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
      : m < 1 ? `<circle cx="107" cy="116" r="3" class="f-fill"/><circle cx="133" cy="116" r="3" class="f-fill"/>`
      : `<path d="M102 118q5 -6 10 0M128 118q5 -6 10 0" class="f-line" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    face = `<circle cx="120" cy="122" r="38" class="f-skin"/><path d="M92 112c4-22 52-22 56 0-10-8-46-8-56 0z" class="f-hair"/>${eye}
      <path d="M110 133q10 ${(5+m*10).toFixed(1)} 20 0" class="f-mouth" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="131" r="5" class="f-cheek" opacity="${(.35+m*.55).toFixed(2)}"/><circle cx="140" cy="131" r="5" class="f-cheek" opacity="${(.35+m*.55).toFixed(2)}"/>
      ${m>=1?`<text x="120" y="26" text-anchor="middle" class="f-hearts">♡ ♡ ♡</text>`:""}`;
  }
  return `<svg viewBox="0 0 240 240" width="${size}" height="${size}" aria-hidden="true">${arc(r1,C1,wf,"r-water")}${S.suppList.length?arc(r2,C2,tf,"r-supp"):""}${face}</svg>`;
}

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss").replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’`´]/g,"'"); }
const escRe = x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const FR_STOP = new Set(["des","les","aux","avec","sans","une","pour","sur","dans","est","que","qui"]);
function searchFoods(raw){
  const q = norm(raw.trim()).replace(/\s+/g," ");
  if(!q) return null;
  const allergy = allergyIn(q);
  const mod = RULES.find(r => r.mod && r.re.test(q) && !(r.unless && r.unless.test(q)));
  const startWord = new RegExp("(^|[\\s,(/'-])"+escRe(q)), exact = new RegExp("^"+escRe(q)+"($|[^a-z])");
  // fr: Französisch kennt keine zusammengesetzten Wörter, dort nur ganze Wörter vergleichen („brisée“ ≠ „riz brisé“)
  const score = (n, syn, fr) => {
    if(exact.test(n)) return 5.5;
    if(n.startsWith(q)) return 5;
    if(startWord.test(n)) return 4;
    if(n.includes(q)) return 3;
    if(startWord.test(syn)) return 2.5;
    if(syn.includes(q)) return 2;
    // Suchbegriff enthält einen bekannten Begriff, z. B. „Kalbsleberwurst“ → „Leberwurst“
    const words = (n.replace(/[(),/.']/g," ")+" "+syn).split(/\s+/).filter(w=>w.length>=4 || (w.length===3 && syn.split(/\s+/).includes(w)));
    if(fr){ // alle Wörter der Suche müssen vorkommen (Plural und weibliche Form erlaubt)
      const same = (a,b) => a===b || a===b+"s" || a===b+"e" || a===b+"es" || a===b+"x" || b===a+"s" || b===a+"e" || b===a+"es" || b===a+"x";
      const all = (n.replace(/[(),/.']/g," ")+" "+syn).split(/\s+/);
      const qw = q.split(/[^a-z]+/).filter(w=>w.length>=3 && !FR_STOP.has(w));
      return qw.length && qw.every(x=>all.some(w=>same(x,w))) ? 1 + Math.min(qw.join("").length,20)/20 : 0;
    }
    const hits = [...new Set(words.filter(w=>q.includes(w)))];
    const len = hits.reduce((t,w)=>t+w.length,0);
    return len ? 1 + Math.min(len,20)/20 : 0;
  };
  // Immer beide Sprachen durchsuchen: deutscher und französischer Name samt Suchbegriffen
  const matches = FOODS.map(f => {
    const n = norm(f[0]), syn = norm(f[3]||"") + (f[7] ? " "+norm(f[7][3]||"") : "");
    let sc = score(n, syn);
    if(f[7]) sc = Math.max(sc, score(norm(f[7][0]), norm(f[7][3]||""), true));
    // Rohmilch-Varianten nur nach vorn, wenn danach gesucht wird
    if(sc && /rohmilch/.test(n) && !/rohmilch|lait cru/.test(q)) sc -= 0.4;
    return {f, sc};
  }).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc || STRICT[y.f[1]]-STRICT[x.f[1]] || fN(x.f).length-fN(y.f).length).map(x=>x.f);
  const rule = matches.length ? null : RULES.find(r => !r.mod && r.re.test(q) && !(r.unless && r.unless.test(q)));
  const bestAllergy = !allergy && matches[0] ? allergyIn(matches[0][0]+" "+(matches[0][7]?matches[0][7][0]:"")) : null;
  return {q, allergy: allergy || bestAllergy, mod, matches, rule};
}

const ABBR = /(^|\s)(z|B|ca|bzw|d|h|u|o|Min|SSW|Std|evtl|ggf|inkl|max|mind|env|p\. ex|ex|cf|SA|c\. à s|c\. à c|c)$/;

const STOP = new Set(["durchgegart","gekocht","gebraten","frisch","selbst","gemacht","pasteurisiert","ganz","gekauft","beidseitig","restaurant","theke","dose","glas","aus","der","dem","vom","mit","und","oder","warm","heiss","hart","roh","rosa","unreif","reif","getrocknet","gegart","weich","rolle","grun","kopf","eisberg","romer","kidney","weisse","schwarze"]);
function foodTerms(f){
  const t = norm(f[0]).replace(/[(),/.\-]/g," ").split(/\s+/).filter(w=>w.length>=4 && !STOP.has(w));
  if(f[4]==="eier") t.push("eier");

}
// Kommt das Lebensmittel als Zutat vor? „Kürbis“ soll nicht „Kürbiskerne“ finden, „Ente“ nicht „Kartoffelente“ o. Ä.
const NOT_AFTER = /^s?(kern|sam|saft|mus|flock|mehl|brot|blatt|tee|essig|pulver|mark)/;
const NOT_BEFORE = /(suss)$/;
function ingHas(ingName, term){
  const n = norm(ingName); let i = n.indexOf(term);
  while(i >= 0){
    const pre = n.slice(0,i);
    const endOfWord = !/[a-z]/.test(n[i+term.length] || " ") || /^(n|e|en|s)?([^a-z]|$)/.test(n.slice(i+term.length));
    const before = (i===0 || /[^a-z]/.test(n[i-1]) || term.length >= 5 || endOfWord) && !NOT_BEFORE.test(pre);
    const rest = n.slice(i+term.length);
    if(before && !NOT_AFTER.test(rest)) return true;
    i = n.indexOf(term, i+1);
  }
  return false;
}

/* ---------- Datensicherung ---------- */
// .txt statt .json: Android teilt nur bestimmte Dateitypen, Textdateien gehören dazu.
function backupFile(){
  const data = Object.assign({}, S); delete data.tab;
  const text = JSON.stringify({app:"bauchgefuehl", version:1, created:todayISO(), data}, null, 1);
  const name = `bauchgefuehl-sicherung-${todayISO()}.txt`;
  return new File([text], name, {type:"text/plain"});
}
async function doBackup(){
  const file = backupFile();
  const done = how => { S.lastBackup = todayISO(); save(); const el=document.getElementById("lastBackup"); if(el) el.textContent=fmtDate(S.lastBackup); toast(how); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:tr("Bauchgefühl-Sicherung","Sauvegarde Bauchgefühl"), text:tr("Sicherung der Bauchgefühl-App vom ","Sauvegarde de l'appli Bauchgefühl du ")+fmtDate(todayISO())});
      done(tr("Sicherung geteilt","Sauvegarde partagée")); return;
    }
  }catch(e){
    if(e && e.name === "AbortError"){ toast(tr("Sicherung abgebrochen","Sauvegarde annulée")); return; }
  }
  // Ohne Teilen-Menü: als Datei speichern
  try{
    const url = URL.createObjectURL(file), a = document.createElement("a");
    a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    done(tr("Sicherung als Datei gespeichert: ","Sauvegarde enregistrée : ")+file.name);
  }catch(e){ toast(tr("Sichern ging nicht. Bitte nochmal versuchen.","La sauvegarde a échoué. Réessaie.")); }
}
let pendingRestore = null;
function readRestore(file){
  const box = document.getElementById("restoreConfirm");
  const r = new FileReader();
  r.onload = () => {
    let obj = null; try{ obj = JSON.parse(r.result); }catch(e){}
    if(!obj || obj.app !== "bauchgefuehl" || !obj.data){ pendingRestore=null; box.hidden=false; box.innerHTML=`<p class="safe" style="margin:0">${tr("Diese Datei ist keine Bauchgefühl-Sicherung. Bitte die Datei „bauchgefuehl-sicherung-….txt“ wählen.","Ce fichier n'est pas une sauvegarde Bauchgefühl. Choisis le fichier « bauchgefuehl-sicherung-….txt ».")}</p>`; return; }
    pendingRestore = obj;
    const d = obj.data;
    box.hidden = false;
    box.innerHTML = `<div class="tip"><b>${tr("Sicherung vom","Sauvegarde du")} ${esc(fmtDate(obj.created||todayISO()))}</b><br>
      ${tr("Termin","Terme")}: ${d.et?esc(fmtDate(d.et)):tr("keiner","aucun")} · ${tr("Favoriten","Favoris")}: ${(d.fav||[]).length} · ${tr("Allergien","Allergies")}: ${esc((d.allergies||[]).map(allergyLabel).join(", ")||tr("keine","aucune"))}</div>
      <p style="margin:0">${tr("Wiederherstellen ersetzt alle Daten auf diesem Handy.","La restauration remplace toutes les données de ce téléphone.")}</p>
      <div class="btnrow"><button class="btn" data-act="restoreYes">${tr("Ja, wiederherstellen","Oui, restaurer")}</button><button class="btn ghost" data-act="restoreNo">${tr("Abbrechen","Annuler")}</button></div>`;
  };
  r.onerror = () => toast(tr("Die Datei ließ sich nicht lesen.","Impossible de lire le fichier."));
  r.readAsText(file);
}

const V_CAT = {u:["Untersuchung","c-u","Examen"], i:["Impfung","c-i","Vaccin"], o:["Organisatorisch","c-o","Démarche"], e:["Eigener Termin","c-e","Mon rendez-vous"]};
const vcatN = c => tr(V_CAT[c][0], V_CAT[c][2]);
const sswTxt = w => { const W = Math.floor(w), d = Math.round((w-W)*7); return d ? `${W}+${d}` : `${W}`; };
function vorsorgeItems(){
  const P = pregnancy(); const now = P ? P.pd/7 : 0; const today = todayISO();
  const std = VORSORGE.map(([id,cat,from,to,tDe,dDe,tFr,dFr]) => {
    const title = tr(tDe,tFr), desc = tr(dDe,dFr);
    const done = !!S.vorsorge.done[id];
    const state = done ? "done" : now > to ? "missed" : now >= from ? "now" : from - now <= 6 ? "soon" : "later";
    return {id, cat, title, desc, when:tr(`SSW ${sswTxt(from)} bis ${sswTxt(to)}`,`SA ${sswTxt(from)} à ${sswTxt(to)}`), state, sort: from};
  });
  const own = S.appts.map(a => {
    const diff = dayNum(a.date) - dayNum(today);
    const state = a.done || diff < 0 ? "done" : diff <= 7 ? "now" : diff <= 42 ? "soon" : "later";
    const wd = wdN((new Date(a.date+"T12:00").getDay()+6)%7).slice(0,tr(2,3));
    return {id:a.id, own:true, cat:"e", title:a.title, desc:"", when:`${wd}${tr(",",".")} ${fmtDate(a.date)}${a.time?tr(` · ${a.time} Uhr`,` · ${a.time}`):""}${diff===0?tr(" · heute"," · aujourd'hui"):diff===1?tr(" · morgen"," · demain"):""}`, state, sort: P ? (P.pd + diff)/7 : diff, date:a.date, time:a.time||""};
  });
  return std.concat(own).sort((x,y) => x.sort - y.sort || (x.time||"").localeCompare(y.time||""));
}
function vorsorgeNext(){
  const it = vorsorgeItems();
  const ownSoon = it.filter(x => x.own && x.state === "now").sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time))[0];
  return ownSoon || it.find(x => x.state === "now") || it.find(x => x.state === "soon") || it.find(x => x.state === "missed") || it.find(x => x.state === "later");
}
function viewVorsorgeCard(){
  const n = vorsorgeNext(), it = vorsorgeItems();
  const open = it.filter(x => x.state === "now").length;
  if(!n) return `<button class="vnext" data-act="vorsorge"><span class="label">${tr("Vorsorge","Suivi de grossesse")}</span><b>${tr("Alles erledigt","Tout est fait")} 💜</b><span class="small">${tr("Kalender öffnen","Ouvrir le calendrier")} ›</span></button>`;
  const badge = n.state === "now" ? tr("jetzt dran","maintenant") : n.state === "missed" ? tr("noch offen","en attente") : tr("demnächst","bientôt");
  return `<button class="vnext" data-act="vorsorge"><span class="label">${tr("Als Nächstes in der Vorsorge","Prochaine étape du suivi")}</span><b>${esc(n.title)}</b><span>${esc(n.when)} · ${badge}</span><span class="small">${open>1?tr(`${open} Punkte jetzt dran · `,`${open} points en cours · `):""}${tr("Kalender öffnen","Ouvrir le calendrier")} ›</span></button>`;
}
function openVorsorge(){
  const it = vorsorgeItems(), cat = ui.vCat || "alle";
  const f = it.filter(x => cat === "alle" || x.cat === cat);
  const done = it.filter(x => x.state === "done").length;
  const row = x => `<div class="vrow ${x.state}"><button class="vcheck" data-vdone="${esc(x.id)}" aria-pressed="${x.state==="done"}" aria-label="${esc(x.title)} ${tr("erledigt","fait")}"></button>
    <div class="vtxt"><b>${esc(x.title)}</b><span>${esc(x.when)}</span>${x.desc?`<small>${esc(x.desc)}</small>`:""}</div>
    <span class="vtag ${V_CAT[x.cat][1]}">${x.state==="missed"?tr("offen","à faire"):vcatN(x.cat)}</span>${x.own?`<button class="iconbtn vdel" data-vdel="${esc(x.id)}" aria-label="${esc(x.title)} ${tr("löschen","supprimer")}">✕</button>`:""}</div>`;
  const group = (label, states) => { const l = f.filter(x => states.includes(x.state)); return l.length ? `<h3 class="vgroup">${label} <span class="small muted">${l.length}</span></h3><div class="vlist">${l.map(row).join("")}</div>` : ""; };
  openSheet(`<div class="head"><h2>${tr("Vorsorge","Suivi de grossesse")}</h2><button class="iconbtn" data-act="close" aria-label="${tr("Schließen","Fermer")}"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="vprog"><div class="head" style="align-items:baseline"><span class="small">${tr(`${done} von ${it.length} erledigt`,`${done} sur ${it.length} faits`)}</span></div><div class="vbar"><i style="width:${(done/Math.max(1,it.length)*100).toFixed(0)}%"></i></div></div>
    <div class="chips">${[["alle",tr("Alle","Tout")],["u",tr("Untersuchungen","Examens")],["i",tr("Impfungen","Vaccins")],["o",tr("Organisatorisch","Démarches")],["e",tr("Eigene","Mes rendez-vous")]].map(([k,l])=>`<button class="chip" data-vcat="${k}" aria-pressed="${cat===k}">${l}</button>`).join("")}</div>
    ${group(tr("Jetzt dran","Maintenant"),["now"])}${group(tr("Demnächst","Bientôt"),["soon"])}
    ${f.some(x=>x.state==="missed")?`<h3 class="vgroup">${tr("Noch offen aus früheren Wochen","Restés ouverts des semaines passées")} <span class="small muted">${f.filter(x=>x.state==="missed").length}</span></h3><p class="small muted" style="margin:0">${tr("Schon erledigt? Einfach abhaken, oder alles auf einmal.","Déjà fait ? Il suffit de cocher, ou tout d'un coup.")}</p><button class="btn ghost small" data-act="vmissedAll" style="align-self:flex-start">${tr("Alle als erledigt markieren","Tout marquer comme fait")}</button><div class="vlist">${f.filter(x=>x.state==="missed").map(row).join("")}</div>`:""}
    ${group(tr("Später","Plus tard"),["later"])}${group(tr("Erledigt","Fait"),["done"])}
    ${f.length?"":`<p class="small muted">${tr("Noch keine eigenen Termine.","Pas encore de rendez-vous personnels.")}</p>`}
    <section class="panel"><h3>${tr("Eigenen Termin hinzufügen","Ajouter un rendez-vous")}</h3>
      <div class="field"><label for="apTitle">${tr("Was","Quoi")}</label><input type="text" id="apTitle" placeholder="${tr("z. B. Frauenärztin, Sage-femme, Kurs","par ex. gynécologue, sage-femme, cours")}"></div>
      <div class="apform"><div class="field"><label for="apDate">${tr("Datum","Date")}</label><input type="date" id="apDate" value="${todayISO()}"></div><div class="field"><label for="apTime">${tr("Uhrzeit","Heure")}</label><input type="time" id="apTime"></div></div>
      <button class="btn" data-act="addAppt">${tr("Hinzufügen","Ajouter")}</button></section>
    <p class="small muted" style="margin:0">${tr("Zeiträume nach dem französischen Vorsorgeplan (HAS, Assurance Maladie). Was für dich gilt, legen Ärztin oder Sage-femme fest.","Calendrier selon le suivi de grossesse en France (HAS, Assurance Maladie). Ce qui s'applique à toi est décidé par ton médecin ou ta sage-femme.")}</p>`, tr("Vorsorge","Suivi de grossesse"));
}

/* ---------- Erinnerungen über den eigenen Server (Raspberry Pi im Tailscale-Netz) ---------- */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function pushBase(){ return (S.push.url || "").trim().replace(/\/+$/, ""); }
function pushSettings(){ return {lang:S.lang, times:S.push.times, waterTimes:S.push.waterTimes, waterOn:S.push.waterOn, waterGoal:S.waterGoal, supps:S.suppList.map(x=>({name:x.name, label:suppN(x.name), time:x.time, hint:hintN(x.hint)})), appts:S.appts.filter(a=>!a.done).map(a=>({title:a.title,date:a.date,time:a.time}))}; }
async function pushPost(path, body){
  const r = await fetch(pushBase() + path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(Object.assign({device:S.deviceId}, body))});
  if(!r.ok){ const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();
}
function b64ToBytes(b64){ const p = "=".repeat((4 - b64.length % 4) % 4), s = atob((b64 + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...s].map(c => c.charCodeAt(0))); }
async function pushConnect(){
  const msg = t => { const el = document.getElementById("pushMsg"); if(el) el.textContent = t; };
  if(!pushSupported()){ msg(tr("Dieses Gerät unterstützt keine Mitteilungen für Web-Apps (iPhone: iOS 16.4 oder neuer).","Cet appareil ne gère pas les notifications des applis web (iPhone : iOS 16.4 ou plus récent).")); return; }
  if(!isStandalone()){ msg(tr("Bitte die App über das Symbol auf dem Home-Bildschirm öffnen, nicht in Safari.","Ouvre l'appli depuis l'icône de l'écran d'accueil, pas dans Safari.")); return; }
  const url = (document.getElementById("pushUrl").value || "").trim();
  if(!/^https:\/\//.test(url)){ msg(tr("Bitte die Adresse mit https:// eintragen, z. B. https://raspberrypi.tail1234.ts.net","Saisis l'adresse avec https://, par ex. https://raspberrypi.tail1234.ts.net")); return; }
  S.push.url = url; save();
  msg(tr("Verbinde …","Connexion …"));
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ msg(tr("Mitteilungen wurden nicht erlaubt. In den iPhone-Einstellungen unter Mitteilungen → Bauchgefühl änderbar.","Les notifications n'ont pas été autorisées. Modifiable dans Réglages de l'iPhone → Notifications → Bauchgefühl.")); return; }
    const kr = await fetch(pushBase() + "/api/key"); if(!kr.ok) throw new Error("Schlüssel");
    const {publicKey} = await kr.json();
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub){ try{ await sub.unsubscribe(); }catch(_){} }
    sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(publicKey)});
    await pushPost("/api/subscribe", {subscription: sub.toJSON(), settings: pushSettings()});
    S.push.on = true; S.push.dirty = false; save();
    await pushSyncStatus();
    openSettings(); toast(tr("Erinnerungen sind eingeschaltet","Les rappels sont activés"));
  }catch(e){
    msg(tr("Der Server ist nicht erreichbar. Ist Tailscale auf dem iPhone eingeschaltet und die Adresse richtig?","Le serveur est injoignable. Tailscale est-il activé sur l'iPhone et l'adresse est-elle correcte ?"));
  }
}
async function pushOff(){
  try{ const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(_){}
  try{ if(pushBase()) await pushPost("/api/unsubscribe", {}); }catch(_){}
  S.push.on = false; save(); openSettings(); toast(tr("Erinnerungen ausgeschaltet","Rappels désactivés"));
}
async function pushTest(){
  try{ if(S.push.settingsDirty) await pushSyncStatus(); await pushPost("/api/test", {}); toast(tr("Testnachricht geschickt","Message test envoyé")); }
  catch(e){ toast(e.status === 404 || e.status === 410 ? tr("Nicht mehr verbunden. Bitte neu einschalten.","Plus connecté. Réactive les notifications.") : tr("Server nicht erreichbar. Tailscale an?","Serveur injoignable. Tailscale activé ?")); }
}
// Tagesstand und Einstellungen melden; schlägt es fehl, später nachholen
let pushTimer = null;
function pushSyncSoon(withSettings){ if(!S.push.on) return; if(withSettings) S.push.settingsDirty = true; S.push.dirty = true; save(); clearTimeout(pushTimer); pushTimer = setTimeout(pushSyncStatus, 1200); }
async function pushSyncStatus(){
  if(!S.push.on || !pushBase()) return;
  const st = dayStats(todayISO());
  try{
    if(S.push.settingsDirty){ await pushPost("/api/settings", {settings: pushSettings()}); S.push.settingsDirty = false; }
    await pushPost("/api/status", {date: todayISO(), water: st.w, taken: st.taken});
    S.push.dirty = false; S.push.lastSync = Date.now(); save();
  }catch(e){
    if(e.status === 404){ S.push.on = false; save(); }
  }
}

function pruneDays(){ const min = dayNum(todayISO()) - 60; ["water","taken"].forEach(k => Object.keys(S[k]).forEach(d => { if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || dayNum(d) < min) delete S[k][d]; })); }

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }

/* ---------- Ereignisse ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(e.target === $sheet){ closeSheet(); return; }
  if(!b) return;
  if(b.dataset.tab){ if($sheet.hidden===false) closeSheet(); setTab(b.dataset.tab); return; }
  if(b.dataset.lang){ const inSheet = !$sheet.hidden && $box.contains(b); setLang(b.dataset.lang); if(inSheet) openSettings(); return; }
  if(b.dataset.recipe){ openRecipe(b.dataset.recipe); return; }
  if(b.dataset.crave){ ui.craving=b.dataset.crave; render(); return; }
  if(b.dataset.rtype){ ui.rType=b.dataset.rtype; render(); return; }
  if(b.dataset.week){ ui.week=+b.dataset.week; render(); const c=document.querySelector(".weekcard"); if(c) c.scrollIntoView({block:"nearest"}); return; }
  if(b.dataset.food){ openFood(+b.dataset.food); return; }
  if(b.dataset.fgroup){ ui.fGroup=b.dataset.fgroup; document.getElementById("flist").innerHTML=foodResults();
    const on=document.querySelector('.groups [aria-pressed="true"]'); if(on) on.scrollIntoView({inline:"center",block:"nearest"}); return; }
  if(b.dataset.letter){ const el=document.getElementById("L-"+b.dataset.letter); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(b.dataset.example){ ui.q=b.dataset.example; const i=document.getElementById("q"); if(i) i.value=ui.q; document.getElementById("flist").innerHTML=foodResults(); return; }
  if(b.dataset.ltab){ ui.lTab=b.dataset.ltab; render(); return; }
  if(b.dataset.complaint){ ui.complaint=b.dataset.complaint; render(); return; }
  if(b.dataset.water){ const k=todayISO(); S.water[k]=Math.max(0,Math.min(20,(S.water[k]||0)+(+b.dataset.water))); pruneDays(); save(); render(); pushSyncSoon(); return; }
  if(b.dataset.take){ const k=todayISO(), l=new Set(S.taken[k]||[]); l.has(b.dataset.take)?l.delete(b.dataset.take):l.add(b.dataset.take); S.taken[k]=[...l]; pruneDays(); save(); render(); pushSyncSoon(); return; }
  if(b.dataset.vdone){ const id=b.dataset.vdone, a=S.appts.find(x=>x.id===id); if(a){ a.done=!a.done; } else { if(S.vorsorge.done[id]) delete S.vorsorge.done[id]; else S.vorsorge.done[id]=todayISO(); } save(); openVorsorge(); render(); return; }
  if(b.dataset.vdel){ S.appts=S.appts.filter(x=>x.id!==b.dataset.vdel); save(); openVorsorge(); render(); pushSyncSoon(true); return; }
  if(b.dataset.vcat){ ui.vCat=b.dataset.vcat; openVorsorge(); return; }
  if(b.dataset.delsupp){ S.suppList=S.suppList.filter(x=>x.name!==b.dataset.delsupp); save(); openSettings(); render(); pushSyncSoon(true); return; }
  if(b.dataset.quicksupp){ const n=b.dataset.quicksupp, h=SUPP_HINTS[n]||["morgens",""]; if(!S.suppList.some(x=>x.name===n)) S.suppList.push({name:n,time:h[0],hint:h[1]}); save(); openSettings(); render(); pushSyncSoon(true); return; }
  if(b.dataset.unallergy){ S.allergies=S.allergies.filter(x=>x!==b.dataset.unallergy); save(); openSettings(); render(); return; }
  if(b.dataset.unhide){ S.hidden=S.hidden.filter(x=>x!==b.dataset.unhide); save(); openSettings(); render(); return; }
  const a = b.dataset.act;
  if(a==="close") closeSheet();
  else if(a==="settings") openSettings();
  else if(a==="sources") openSources();
  else if(a==="saveEt"){
    const et = document.getElementById("et").value, lmp = document.getElementById("lmp").value;
    let v = et || (lmp ? isoFromNum(dayNum(lmp)+280) : "");
    if(!v){ toast(tr("Bitte ein Datum eintragen.","Saisis une date.")); return; }
    const diff = dayNum(v) - dayNum(todayISO());
    if(diff > 300 || diff < -30){ toast(tr("Das Datum liegt zu weit weg. Bitte prüfen.","La date est trop éloignée. Vérifie-la.")); return; }
    S.et = v; save(); closeSheet(); render(); toast(tr("Termin gespeichert: ","Date enregistrée : ")+fmtDate(v));
  }
  else if(a==="fav"){ const id=b.dataset.id; S.fav = S.fav.includes(id) ? S.fav.filter(x=>x!==id) : S.fav.concat(id); save(); openRecipe(id); render(); toast(S.fav.includes(id)?tr("Als Lieblingsrezept gemerkt","Ajoutée aux recettes préférées"):tr("Aus Favoriten entfernt","Retirée des favoris")); }
  else if(a==="hide"){ const id=b.dataset.id; const on=!S.hidden.includes(id); S.hidden = on ? S.hidden.concat(id) : S.hidden.filter(x=>x!==id); save(); closeSheet(); render(); toast(on?tr("Wird nicht mehr vorgeschlagen. Rückgängig in den Einstellungen.","Ne sera plus proposée. Annulable dans les réglages."):tr("Wird wieder vorgeschlagen","Sera de nouveau proposée")); }
  else if(a==="addAllergy"){ const v=(document.getElementById("newAllergy").value||"").trim(); if(!v){ toast(tr("Bitte eine Allergie eintippen.","Saisis une allergie.")); return; } if(!S.allergies.some(x=>norm(x)===norm(v))) S.allergies=S.allergies.concat(v); save(); openSettings(); render(); toast(tr(`„${v}“ als Allergie eingetragen`,`« ${v} » ajoutée aux allergies`)); }
  else if(a==="addSupp"){
    const n=(document.getElementById("suppName").value||"").trim(); if(!n){ toast(tr("Bitte einen Namen eintragen.","Saisis un nom.")); return; }
    if(S.suppList.some(x=>norm(x.name)===norm(n)||norm(suppN(x.name))===norm(n))){ toast(tr(`„${n}“ ist schon eingetragen.`,`« ${n} » existe déjà.`)); return; }
    S.suppList.push({name:n, time:document.getElementById("suppTime").value, hint:(document.getElementById("suppHint").value||"").trim()});
    save(); openSettings(); render(); pushSyncSoon(true); toast(tr(`„${n}“ hinzugefügt`,`« ${n} » ajouté`)); }
  else if(a==="vorsorge"){ openVorsorge(); }
  else if(a==="vmissedAll"){ vorsorgeItems().filter(x=>x.state==="missed"&&!x.own).forEach(x=>{ S.vorsorge.done[x.id]=todayISO(); }); save(); openVorsorge(); render(); toast(tr("Frühere Punkte als erledigt markiert","Points passés marqués comme faits")); }
  else if(a==="addAppt"){
    const t=(document.getElementById("apTitle").value||"").trim(), d=document.getElementById("apDate").value, tm=document.getElementById("apTime").value;
    if(!t){ toast(tr("Bitte eintragen, was für ein Termin.","Indique de quel rendez-vous il s'agit.")); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast(tr("Bitte ein Datum wählen.","Choisis une date.")); return; }
    S.appts.push({id:"a"+Date.now().toString(36), title:t, date:d, time:tm||"", done:false}); save(); ui.vCat="alle"; openVorsorge(); render(); pushSyncSoon(true); toast(tr(`Termin „${t}“ eingetragen`,`Rendez-vous « ${t} » ajouté`)); }
  else if(a==="pushOn"){ pushConnect(); }
  else if(a==="pushOff"){ pushOff(); }
  else if(a==="pushTest"){ pushTest(); }
  else if(a==="backup"){ doBackup(); }
  else if(a==="restore"){ const i=document.getElementById("restoreFile"); i.value=""; i.click(); }
  else if(a==="restoreNo"){ pendingRestore=null; document.getElementById("restoreConfirm").hidden=true; }
  else if(a==="restoreYes" && pendingRestore){ const keepTab=S.tab; S=normalize(pendingRestore.data); S.tab=keepTab; pendingRestore=null; save(); closeSheet(); render(); toast(tr("Sicherung wiederhergestellt","Sauvegarde restaurée")); }
  else if(a==="reset"){ document.getElementById("resetConfirm").hidden=false; }
  else if(a==="resetNo"){ document.getElementById("resetConfirm").hidden=true; }
  else if(a==="resetYes"){ try{localStorage.removeItem(KEY);}catch(e){} S=load(); closeSheet(); setTab("heute"); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id==="waterGoal"){ S.waterGoal=+t.value; save(); render(); pushSyncSoon(true); }
  else if(t.dataset.ptime){ S.push.times[t.dataset.ptime]=t.value; save(); pushSyncSoon(true); }
  else if(t.dataset.pwater!=null && t.dataset.pwater!==""){ S.push.waterTimes[+t.dataset.pwater]=t.value; save(); pushSyncSoon(true); }
  else if(t.id==="pushWaterOn"){ S.push.waterOn=t.checked; save(); pushSyncSoon(true); }
  else if(t.id==="restoreFile" && t.files && t.files[0]){ readRestore(t.files[0]); }
  else if(t.id==="rnut"){ ui.rNut=t.value||null; render(); }
  else if(t.id==="lmp" && t.value){ const et=document.getElementById("et"); if(et) et.value=isoFromNum(dayNum(t.value)+280); }
});
document.addEventListener("input", e => { if(e.target.id==="q"){ ui.q=e.target.value; document.getElementById("flist").innerHTML=foodResults(); } });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$sheet.hidden) closeSheet(); });

try{ const qt = new URLSearchParams(location.search).get("tab"); if(qt) { S.tab = qt; history.replaceState(null, "", location.pathname); } }catch(_){}
setTab(S.tab || "heute");
if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => { if(e.data && e.data.tab) setTab(e.data.tab); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ render(); if(S.push.on) pushSyncStatus(); } });
if(S.push.on) setTimeout(pushSyncStatus, 1500);

/* Offline-Nutzung und Updates
   Beim Start und jedes Mal, wenn die App wieder in den Vordergrund kommt, nach einer neuen Version fragen.
   Ist eine da, lädt die App sich einmal selbst neu. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let reloading = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadController && !reloading){ reloading = true; location.reload(); } });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
      const check = ()=>{ reg.update().catch(()=>{}); };
      document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") check(); });
      setInterval(check, 60*60*1000);
    }).catch(()=>{});
  });
}
