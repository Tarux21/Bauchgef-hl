<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bauchgefühl</title>
<meta name="description" content="Ernährung in der Schwangerschaft: Wochenbegleiter, Heißhunger-Alternativen, Lebensmittel-Ampel, Rezepte und Einkaufsliste.">
<meta name="theme-color" content="#f7f3fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauchgefühl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App, feste Navigation unten, Rezepte öffnen als Blatt von unten */
/* Farbwelt „Lavendel & Rosé“: weiche Pastelltöne, Farbverlauf in der Wochen-Karte, jede Nährstoff-Kachel in eigener Farbe.
   Die Namen --sage/--apricot sind historisch: --sage ist die Hauptfarbe (Lavendel), --apricot die Zweitfarbe (Rosé). */
:root{
  --bg:#f7f3fb; --fg:#352d40; --muted:#7c7194; --line:#e7def3;
  --surface:#ffffff; --card:#f3eef9;
  --sage:#7f55bd; --sage-soft:#ece6fb; --on-sage:#ffffff;
  --apricot:#c2507f; --apricot-soft:#fbe6ef;
  --hero:linear-gradient(135deg,#d3c2f1 0%,#f6cddd 100%); --hero-fg:#3a2b52; --ring:#7b52b8; --ring-track:rgb(255 255 255 / .6);
  --t1:#fde7ef; --t2:#ece6fb; --t3:#e3effb; --t4:#fff0dc;
  --t1-fg:#b2456f; --t2-fg:#7149ad; --t3-fg:#3d6fa8; --t4-fg:#a3631a;
  --ok:#3f7d4a; --warn:#8a5f08; --no:#b23b4f;
  --ok-soft:#e2f2e5; --warn-soft:#fbf0d6; --no-soft:#fbe0e6;
  --shade:rgb(40 25 60 / .4);
  --water:#5f93d6; --water-soft:#dbe8f7; --heart:#d4537e;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1724; --fg:#efe8f6; --muted:#a99cbd; --line:#3a3049;
  --surface:#262030; --card:#2f2839;
  --sage:#c4a6f0; --sage-soft:#332b4a; --on-sage:#241a33;
  --apricot:#f09cc0; --apricot-soft:#43283a;
  --hero:linear-gradient(135deg,#4a3870 0%,#6e3a5a 100%); --hero-fg:#f6eefe; --ring:#e8d8ff; --ring-track:rgb(255 255 255 / .18);
  --t1:#43283a; --t2:#332b4a; --t3:#24344a; --t4:#3f3322;
  --t1-fg:#f7a8c8; --t2-fg:#cdb3f5; --t3-fg:#9cc5f2; --t4-fg:#f2c27e;
  --ok:#8fcf9b; --warn:#e8c06a; --no:#f29aaa;
  --ok-soft:#24382a; --warn-soft:#3d3320; --no-soft:#46252e;
  --shade:rgb(0 0 0 / .6); --water:#8ab8ee; --water-soft:#24344a; --heart:#f08aac; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:27px;font-weight:600}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}

main{max-width:560px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head p{margin:4px 0 0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg)}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--sage);font-weight:600}

/* Karten & Bausteine */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-sage);font-weight:600}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--sage);color:var(--on-sage)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.small{padding:7px 12px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-no{background:var(--no-soft);color:var(--no)}
.nut-tag{font-size:12px;color:var(--sage);font-weight:600}
input[type=date],input[type=number],input[type=search],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}

/* Heute */
.week{background:var(--hero);color:var(--hero-fg);border-radius:26px;padding:16px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.week::after{content:"";position:absolute;right:-28px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgb(255 255 255 / .22);pointer-events:none}
.week .label,.week .small{color:inherit;opacity:.8}
.ring{width:96px;height:96px;flex:none}
.ring .track{stroke:var(--ring-track)} .ring .bar{stroke:var(--ring)}
.ring text{font-family:var(--display);font-weight:600;fill:var(--hero-fg)}
.week .big{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1}
.nut{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nut div{border-radius:18px;padding:10px 12px;font-size:13.5px;min-width:0;background:var(--t2)}
.nut div:nth-child(4n+1){background:var(--t1)} .nut div:nth-child(4n+1) b{color:var(--t1-fg)}
.nut div:nth-child(4n+2){background:var(--t2)} .nut div:nth-child(4n+2) b{color:var(--t2-fg)}
.nut div:nth-child(4n+3){background:var(--t3)} .nut div:nth-child(4n+3) b{color:var(--t3-fg)}
.nut div:nth-child(4n+4){background:var(--t4)} .nut div:nth-child(4n+4) b{color:var(--t4-fg)}
.nut .ni{display:block;width:28px;height:28px;margin-bottom:4px}
.nut b{display:block;font-size:15px;margin-bottom:2px}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.meal:last-child{border-bottom:0}
.meal .slot{color:var(--muted);font-size:14px}
.meal .name{font-weight:500;min-width:0}
.meal .go{color:var(--muted)}
.supp{display:flex;flex-wrap:wrap;gap:8px}
.supp label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--surface);font-size:14px}
.supp input{width:18px;height:18px;accent-color:var(--sage)}
.tip{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px}

/* Lust auf */
.crave-q{background:var(--apricot-soft);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.crave-q h1{color:var(--apricot)}
.crave-q .chip{border-color:transparent}
.crave-q .chip[aria-pressed="true"]{background:var(--apricot);color:var(--surface)}
.swap{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.swap .from{color:var(--muted);text-decoration:line-through}
.swap .arrow{color:var(--apricot);font-weight:700}

/* Antwortkarte Lebensmittel-Suche */
.answer{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.answer .verdict{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.answer b{font-size:17px}
.answer small{color:var(--muted);font-size:13px}
.a-ok{background:var(--ok-soft)} .a-ok .verdict{color:var(--ok)}
.a-warn{background:var(--warn-soft)} .a-warn .verdict{color:var(--warn)}
.a-no{background:var(--no-soft)} .a-no .verdict{color:var(--no)}
.a-info{background:var(--card);border:1px solid var(--line)} .a-info .verdict{color:var(--muted);font-size:22px}
input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}

/* Lebensmittel-Liste und Steckbrief */
button.frow{width:100%;text-align:left;font:inherit;color:inherit}
.groups{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.groups .chip{white-space:nowrap;flex:none}
.groups .chip.kitchen{border-color:var(--apricot);color:var(--apricot)}
.groups .chip.kitchen[aria-pressed="true"]{background:var(--apricot);color:var(--surface)}
.abc{display:flex;flex-wrap:wrap;gap:2px}
.abc button{border:0;background:none;color:var(--sage);font-weight:800;font-size:14px;min-width:28px;height:30px;border-radius:8px}
.abc button:active{background:var(--sage-soft)}
.letter{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 12px);color:var(--sage);margin-top:4px}
.answer .more{align-self:flex-start;margin-top:4px;background:var(--surface)}
.fsec{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:10px 12px;font-size:15px}
.fsec > b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fsec .meal{grid-template-columns:86px 1fr auto;padding:8px 0}
.nchip{border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--t2);color:var(--t2-fg)}
.nchip:nth-child(4n+1){background:var(--t1);color:var(--t1-fg)} .nchip:nth-child(4n+3){background:var(--t3);color:var(--t3-fg)} .nchip:nth-child(4n+4){background:var(--t4);color:var(--t4-fg)}

/* Deine Woche */
.wnav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.wnav .wtitle{text-align:center;min-width:0}
.wnav .iconbtn{font-size:22px;line-height:1}
.wnav .iconbtn:disabled{opacity:.35}
.cmp{font-family:var(--display);font-weight:600;font-size:18px;color:var(--apricot);text-wrap:balance}
.cmprow{display:flex;gap:12px;align-items:center}
.wi{width:58px;height:58px;flex:none;border-radius:50%;background:var(--t2);display:grid;place-items:center}
.wi svg{width:44px;height:44px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.facts b{display:block;font-family:var(--display);font-size:17px;color:var(--fg)}
.ruler{position:relative;height:8px;background:var(--card);border-radius:9px;margin-bottom:14px}
.ruler i{position:absolute;left:0;top:0;bottom:0;background:var(--sage);border-radius:9px}
.ruler span{position:absolute;top:11px;font-size:11px;color:var(--muted)}
.ruler span:first-of-type{left:0} .ruler span:last-of-type{right:0}
.forme{background:var(--apricot-soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
.forme b{color:var(--apricot)}

/* Vorsorge */
.vnext{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:0;border-radius:22px;padding:14px 16px;background:var(--hero);color:var(--hero-fg)}
.vnext .label,.vnext .small{color:inherit;opacity:.8}
.vnext b{font-family:var(--display);font-size:19px;font-weight:600}
.vprog{display:flex;flex-direction:column;gap:6px}
.vbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden} .vbar i{display:block;height:100%;background:var(--sage);border-radius:99px}
.vgroup{margin-top:4px;display:flex;gap:6px;align-items:baseline}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface)}
.vrow.now{border-color:var(--apricot)} .vrow.missed{border-color:var(--warn)}
.vcheck{width:24px;height:24px;border-radius:8px;border:2px solid var(--sage);background:none;display:grid;place-items:center;margin-top:1px}
.vcheck[aria-pressed="true"]{background:var(--sage)}
.vcheck[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid var(--on-sage);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.vtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.vtxt b{font-size:15px} .vtxt span{font-size:13px;color:var(--muted)} .vtxt small{font-size:13px;color:var(--fg);opacity:.85}
.vrow.done .vtxt b{color:var(--muted);text-decoration:line-through} .vrow.done .vtxt small{display:none}
.vtag{border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.c-u{background:var(--t2);color:var(--t2-fg)} .c-i{background:var(--t3);color:var(--t3-fg)} .c-o{background:var(--t4);color:var(--t4-fg)} .c-e{background:var(--t1);color:var(--t1-fg)}
.vrow.missed .vtag{background:var(--warn-soft);color:var(--warn)}
.vdel{width:30px;height:30px;font-size:13px}
.apform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.apform input{min-width:0}

/* Tagesziel */
.daygoal{gap:12px}
.dg-ring{display:grid;place-items:center;background:var(--card);border-radius:22px;padding:8px}
.dg-ring svg{max-width:100%;height:auto}
.r-water{stroke:var(--water)} .r-water-bg{stroke:var(--water-soft)}
.r-supp{stroke:var(--sage)} .r-supp-bg{stroke:var(--line)}
@media (prefers-reduced-motion:no-preference){ .r-water,.r-supp{transition:stroke-dasharray .6s ease} }
.f-skin{fill:#fde3d3} .f-hair{fill:#f4c4d6} .f-line{stroke:#7a4a5a} .f-fill{fill:#7a4a5a} .f-mouth{stroke:#c2507f} .f-cheek{fill:#f9a8c4} .f-hearts{font-family:var(--display);font-size:16px;fill:var(--apricot)}
.dg-status{font-family:var(--display);font-size:17px;text-align:center}
.dg-status small{display:block;font-family:var(--body);font-size:13px;color:var(--muted)}
.c-water{color:var(--water)} .c-supp{color:var(--sage)}
.dg-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11px;color:var(--muted)}
.dg-day{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.dg-day.today span:last-child{color:var(--apricot);font-weight:800}
.dg-dot{position:absolute;top:15px;width:6px;height:6px;border-radius:50%;background:var(--apricot)}
.dg-streak{background:var(--apricot-soft);color:var(--apricot);border-radius:12px;padding:7px 10px;font-weight:800;font-size:14px;text-align:center}
.dg-streak.muted-streak{background:var(--card);color:var(--muted);font-weight:600}
.dg-list{display:flex;flex-direction:column;gap:6px}
.dg-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);width:100%;text-align:left}
.dg-box{width:24px;height:24px;border-radius:8px;border:2px solid var(--sage);display:grid;place-items:center;flex:none}
.dg-item[aria-pressed="true"] .dg-box{background:var(--sage)}
.dg-item[aria-pressed="true"] .dg-box::after{content:"";width:6px;height:11px;border:solid var(--on-sage);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dg-item[aria-pressed="true"] .dg-name{color:var(--muted);text-decoration:line-through}
.dg-item small{margin-left:auto;color:var(--muted);text-align:right;font-size:12.5px;max-width:55%}
.dg-water{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wbtn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--water);color:var(--surface)}
.wbtn.minus{background:var(--water-soft);color:var(--water)}
.suppform{display:grid;grid-template-columns:1fr auto;gap:8px}
.ptimes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptimes label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.ptimes input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;width:100%;min-width:0;font-size:15px}
.ptoggle{display:flex;gap:8px;align-items:center;font-size:14px}
.ptoggle input{width:20px;height:20px;accent-color:var(--sage)}
.suppform input[type=text]#suppHint{grid-column:1/2}

/* Trink-Zähler */
.glasses{display:flex;gap:10px;flex-wrap:wrap}
.glass{width:38px;height:48px;border:2.5px solid var(--water);border-top-width:0;border-radius:0 0 10px 10px;background:transparent;position:relative;overflow:hidden;padding:0}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water);transition:height .2s}
.glass.full::after{height:72%}
.water-txt{color:var(--water);font-size:14px}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.fav{position:absolute;top:12px;right:14px;color:var(--heart);font-size:18px;line-height:1}
.hidden-chip{text-decoration:line-through;color:var(--muted)}

/* Rezeptliste */
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{position:relative;display:flex;flex-direction:column;gap:5px;padding:13px 36px 13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.rcard strong{font-size:16px}
.meta{display:flex;gap:4px 12px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* Ampel */
.search{position:relative}
.search input{padding-left:40px;font-size:17px;border:2px solid var(--sage);border-radius:14px;padding-block:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.frow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.frow .why{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}

/* Woche */
.headbtns{display:flex;gap:8px;align-items:center}
.langsw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.langsw button{border:0;background:none;border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted);min-width:36px}
.langsw button[aria-pressed="true"]{background:var(--sage);color:var(--on-sage)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.day{display:flex;flex-direction:column;gap:2px}
.day h3{display:flex;justify-content:space-between;align-items:baseline}
.day.today{border-color:var(--sage)}
.pslot{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.pslot span{font-size:14px;color:var(--muted)}
.pslot select{padding:8px 10px;font-size:14.5px}
.shop-group{display:flex;flex-direction:column;gap:2px}
.shop-item{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.shop-item input{width:20px;height:20px;accent-color:var(--sage);flex:none}
.shop-item .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.shop-item.done .nm{text-decoration:line-through;color:var(--muted)}

/* Rezept-Blatt */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--shade)}
.sheet .box{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet ul,.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ing{list-style:none;padding:0!important}
.ing li{display:grid;grid-template-columns:90px 1fr;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ing li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.safe{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14.5px}
.safe b{color:var(--warn)}
.addplan{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}
.disclaimer{font-size:12.5px;color:var(--muted);text-align:center;padding-top:4px}
@media (prefers-reduced-motion:no-preference){.sheet .box{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

"joghurtbowl":["Bol de yaourt, pomme et graines de courge",["Laver la pomme et la couper en petits morceaux.","Répartir le yaourt dans deux bols, ajouter la pomme, les flocons d'avoine et les graines de courge.","Sucrer avec un peu de miel."],"",""],
"kaesebrot":["Pain complet au comté et poivron",["Tartiner le pain de fromage frais et garnir de comté.","Laver le poivron, le couper en lanières et le manger avec."],"Idéal à partir du 2e trimestre pour les quelque 250 kcal supplémentaires par jour. Le poivron apporte de la vitamine C.",""],
"milchreis":["Riz au lait doux à la pomme et cannelle",["Porter le lait à ébullition avec le riz, puis laisser gonfler 25 minutes à feu doux en remuant de temps en temps.","Râper la pomme et l'incorporer.","Assaisonner de cannelle et d'un peu de miel."],"Doux et digeste. Fait du bien à beaucoup de femmes quand les nausées arrivent au 1er trimestre.",""],
"linsenbolo":["Bolognaise de lentilles et spaghetti complets",["Couper finement l'oignon, la carotte et le poivron et les faire revenir 5 minutes dans l'huile.","Ajouter les lentilles, les tomates et 200 ml d'eau et laisser mijoter 15 minutes.","Pendant ce temps, cuire les spaghetti selon le paquet.","Assaisonner la sauce d'origan et de sel iodé."],"La vitamine C du poivron aide à absorber le fer des lentilles.",""],
"ofenlachs":["Saumon au four, brocoli et quartiers de pommes de terre",["Préchauffer le four à 200 °C. Couper les pommes de terre en quartiers, mélanger avec l'huile et le sel et cuire 15 minutes.","Ajouter le saumon et les fleurettes de brocoli et cuire encore 15 à 18 minutes.","Le saumon est prêt quand il n'est plus translucide à l'intérieur et se défait facilement.","Servir avec des quartiers de citron."],"","Bien cuire le saumon. Pas de cœur translucide, pas de saumon fumé ou gravlax."],
"seelachs":["Lieu noir et écrasé pommes de terre-carottes",["Éplucher les pommes de terre et les carottes, les couper en dés et les cuire 20 minutes à l'eau salée.","Sécher le poisson, saler et le cuire dans l'huile 4 à 5 minutes de chaque côté, jusqu'à ce qu'il soit blanc et se défasse en feuillets.","Égoutter les légumes et les écraser avec le lait chaud.","Servir avec du citron."],"","Cuire le poisson jusqu'à ce qu'il se défasse en lamelles."],
"haehnchen":["Poêlée de poulet aux légumes et riz complet",["Cuire le riz selon le paquet.","Couper le poulet en lanières et le faire dorer dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Ajouter les légumes en lanières et faire sauter 5 minutes.","Assaisonner de sauce soja."],"","Bien cuire la volaille. Laver la planche et le couteau à l'eau chaude après la viande crue."],
"rindpfanne":["Poêlée de bœuf aux poivrons et boulgour",["Verser 300 ml d'eau bouillante sur le boulgour et laisser gonfler 10 minutes.","Saisir la viande à feu vif dans l'huile jusqu'à ce qu'elle ne soit plus rosée à l'intérieur.","Ajouter l'oignon et le poivron, faire sauter 5 minutes, assaisonner.","Servir avec le boulgour."],"Le bœuf apporte du fer bien assimilable, le poivron de la vitamine C.","Bien cuire le bœuf (toxoplasmose). Pas de cœur rosé."],
"curry":["Curry de pois chiches aux épinards et riz",["Cuire le riz selon le paquet.","Hacher finement l'oignon et l'ail, les faire revenir dans un peu de lait de coco, ajouter le curry et faire griller brièvement.","Ajouter les tomates, les pois chiches (rincés), le reste du lait de coco et les épinards.","Laisser mijoter 10 minutes et saler."],"",""],
"linsensuppe":["Soupe de lentilles corail au gingembre",["Couper l'oignon, les carottes et le gingembre en petits morceaux.","Porter à ébullition avec les lentilles et le bouillon et laisser mijoter 15 minutes.","Ajouter le lait de coco et mixer finement.","Assaisonner de sel iodé."],"Le gingembre peut aider contre les nausées. Doux et bien toléré au 1er trimestre.",""],
"ofenkartoffel":["Pomme de terre au four et fromage blanc aux herbes",["Laver les pommes de terre, les piquer plusieurs fois et les cuire environ 50 minutes à 200 °C.","Lisser le fromage blanc avec le yaourt, bien laver la ciboulette, la ciseler et l'incorporer, saler.","Ouvrir les pommes de terre, garnir de fromage blanc, servir avec le concombre."],"","Bien laver les herbes fraîches (toxoplasmose, listeria)."],
"pizza":["Pizza sur pain pita aux légumes",["Préchauffer le four à 220 °C.","Tartiner le pain de tomates, assaisonner d'origan.","Disposer les légumes en rondelles, effilocher la mozzarella et la répartir.","Cuire 10 à 12 minutes, jusqu'à ce que le fromage bouillonne."],"","Prendre une mozzarella au lait pasteurisé (indiqué sur l'emballage)."],
"burger":["Burger dans un petit pain complet",["Saler la viande hachée et former deux steaks plats.","Les cuire à la poêle 4 à 5 minutes de chaque côté, jusqu'à ce qu'ils soient gris et non rosés à l'intérieur. À la fin, poser le fromage dessus.","Laver et couper la salade et la tomate.","Toaster brièvement les pains et garnir."],"","Bien cuire la viande hachée, plus rosée à l'intérieur (toxoplasmose, E. coli)."],
"suesskartoffel":["Frites de patate douce au four",["Préchauffer le four à 220 °C.","Couper les patates douces en bâtonnets, mélanger avec l'huile et les épices.","Les étaler espacées sur une plaque et cuire 25 à 30 minutes en les retournant une fois."],"Cuire jusqu'à doré plutôt que brun foncé : il se forme moins d'acrylamide.",""],
"kichererbsen":["Pois chiches croustillants au four",["Préchauffer le four à 200 °C.","Rincer les pois chiches et bien les sécher avec un torchon.","Mélanger avec l'huile et les épices et cuire 25 minutes, jusqu'à ce qu'ils croustillent."],"",""],
"popcorn":["Pop-corn maison",["Mettre l'huile et le maïs dans une grande casserole, couvrir.","Chauffer à feu moyen en secouant la casserole de temps en temps, jusqu'à ce que ça n'éclate presque plus.","Assaisonner de sel iodé."],"",""],
"hummus":["Houmous et bâtonnets de légumes",["Rincer les pois chiches et les mixer finement avec le tahini, le jus de citron, l'ail, le sel et 3 c. à s. d'eau.","Laver, éplucher et couper les légumes en bâtonnets."],"",""],
"dattelkugeln":["Boules dattes-cacao",["Moudre finement les flocons d'avoine et les graines de courge au mixeur.","Ajouter les dattes et le cacao et mixer jusqu'à obtenir une pâte collante.","Former 12 boules et les rouler dans la noix de coco. Se conservent une semaine au réfrigérateur."],"Le cacao contient un peu de caféine, mais très peu pour quelques boules par jour.",""],
"nicecream":["Glace banane-chocolat (nice cream)",["La veille, couper les bananes en rondelles et les congeler.","Mixer les rondelles congelées avec le cacao, le beurre de cacahuète et le lait jusqu'à ce que ce soit crémeux.","À déguster aussitôt."],"",""],
"joghurteis":["Glaces à l'eau yaourt-fruits rouges",["Faire bouillir les fruits rouges 2 minutes et laisser refroidir.","Mixer avec le yaourt et le miel.","Verser dans des moules à glace et congeler au moins 4 heures."],"","Faire bouillir brièvement les fruits rouges surgelés avant."],
"haferkekse":["Cookies banane-avoine",["Préchauffer le four à 180 °C.","Écraser les bananes à la fourchette, mélanger avec les flocons d'avoine, les raisins secs, les graines de tournesol et la cannelle.","Déposer 12 petits tas sur la plaque, aplatir et cuire 15 minutes."],"",""],
"muffins":["Muffins pomme-cannelle à l'épeautre complet",["Préchauffer le four à 180 °C, préparer le moule à muffins.","Mélanger les œufs, le lait, le sucre et l'huile, incorporer la farine, la levure et la cannelle.","Râper les pommes, les incorporer et remplir 12 moules.","Cuire 20 à 25 minutes. Une pique en bois doit ressortir propre."],"","Ne pas goûter la pâte crue, elle contient des œufs crus."],
"trauben":["Raisins congelés",["Bien laver les raisins et les sécher.","Les couper en deux, les étaler sur une assiette et congeler 2 heures.","À grignoter directement sortis du congélateur."],"Presque comme des bonbons, mais avec des fibres.",""],
"gurkensalat":["Salade de concombre à l'aneth et au citron",["Laver le concombre et le couper en fines rondelles à la mandoline.","Mélanger le yaourt avec le jus de citron, l'aneth lavé et haché et le sel.","Mélanger avec le concombre."],"",""],
"overnight":["Overnight oats banane et graines de courge",["Le soir, mélanger les flocons d'avoine, le lait et le yaourt dans deux bocaux et mettre au réfrigérateur, couverts.","Le matin, couper la banane en rondelles et l'ajouter avec les graines de courge et la cannelle."],"Préparé en 5 minutes le soir, prêt tout de suite le matin.",""],
"avocadotoast":["Toast complet avocat et œuf",["Cuire les œufs durs 10 minutes, les passer sous l'eau froide et les écaler.","Écraser l'avocat avec un peu de jus de citron et de sel iodé.","Griller le pain, tartiner d'avocat, poser l'œuf en rondelles dessus."],"","Cuire les œufs durs, le jaune doit être ferme."],
"beerenquark":["Fromage blanc aux myrtilles et flocons d'avoine",["Lisser le fromage blanc avec le lait et le miel.","Bien laver les myrtilles.","Répartir le fromage blanc dans des bols, ajouter les myrtilles et les flocons d'avoine."],"Bien laver les fruits rouges frais. Les fruits rouges surgelés seulement cuits.",""],
"knaecke":["Pain croustillant, fromage frais et concombre",["Tartiner le pain croustillant de fromage frais.","Couper le concombre en rondelles et les poser dessus.","Parsemer de ciboulette lavée."],"Sec et doux. Un pain croustillant encore au lit aide beaucoup de femmes contre les nausées matinales.",""],
"pfannkuchen":["Pancakes banane-avoine",["Écraser les bananes, mélanger avec les œufs, les flocons d'avoine et la cannelle.","Cuire de petits pancakes dans la poêle huilée, 2 à 3 minutes de chaque côté.","Ils sont prêts quand ils ne sont plus humides à l'intérieur."],"","Bien cuire les pancakes, la pâte contient de l'œuf cru."],
"hirsebrei":["Bouillie de millet à la pomme et cannelle",["Rincer le millet à l'eau chaude dans une passoire.","Le porter à ébullition avec le lait et laisser gonfler 15 minutes à feu doux.","Râper la pomme, l'incorporer, assaisonner de cannelle et de miel."],"Le millet apporte du fer et du magnésium et il est doux pour l'estomac.",""],
"thunfischpasta":["Penne complètes, sauce tomate au thon",["Cuire les penne selon le paquet.","Hacher finement l'oignon et l'ail et les faire revenir dans l'huile.","Ajouter les tomates et laisser mijoter 8 minutes.","Égoutter le thon, l'émietter, l'incorporer et réchauffer brièvement. Assaisonner d'origan et de sel."],"","Thon au maximum environ 1 fois par semaine à cause du mercure."],
"thunfischsalat":["Salade de haricots blancs au thon",["Rincer et égoutter les haricots.","Couper finement le poivron et l'oignon en dés.","Mélanger le tout avec le thon égoutté, le jus de citron, l'huile et le sel.","Manger avec du pain complet."],"","Thon au maximum environ 1 fois par semaine à cause du mercure."],
"wraps":["Wraps au poulet, sauce yaourt",["Couper le poulet en lanières, assaisonner et le faire cuire dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Couper le poivron en lanières, laver la salade.","Mélanger le yaourt avec un peu de sel.","Réchauffer brièvement les wraps, garnir et rouler."],"","Bien cuire le poulet."],
"omelett":["Omelette aux légumes et feta",["Couper la courgette en dés et la faire revenir 4 minutes dans l'huile, couper les tomates en deux et les ajouter.","Battre les œufs, les verser dessus, émietter la feta par-dessus.","Laisser prendre 6 à 8 minutes à couvert et à feu doux, jusqu'à ce que le dessus soit ferme.","Servir avec du pain."],"","Laisser l'omelette bien prendre. Feta au lait pasteurisé."],
"auflauf":["Gratin pommes de terre-brocoli",["Couper les pommes de terre en rondelles et les précuire 10 minutes, ajouter le brocoli les 3 dernières minutes.","Préchauffer le four à 200 °C.","Mettre les légumes dans un plat à gratin, verser le lait assaisonné de muscade et de sel.","Râper le fromage, le parsemer et gratiner 20 minutes jusqu'à ce que ce soit doré."],"",""],
"putengeschnetzeltes":["Émincé de dinde aux champignons et riz",["Cuire le riz selon le paquet.","Couper la dinde en lanières et la faire dorer dans l'huile jusqu'à ce qu'elle soit blanche à l'intérieur. Réserver.","Faire revenir 5 minutes l'oignon et les champignons émincés dans la même cocotte.","Ajouter la crème, remettre la viande, porter brièvement à ébullition et saler."],"","Bien cuire la dinde. Bien faire revenir les champignons."],
"chili":["Chili sin carne doux",["Cuire le riz selon le paquet.","Couper l'oignon et le poivron en dés et les faire revenir dans l'huile.","Ajouter les lentilles, les tomates et 250 ml d'eau et laisser mijoter 12 minutes.","Ajouter les haricots rincés et le maïs, laisser mijoter encore 5 minutes et assaisonner."],"Peu épicé pour être supporté aussi en cas de brûlures d'estomac. Relever à son goût.",""],
"bolognese":["Spaghetti bolognaise au bœuf haché",["Couper finement l'oignon et la carotte en dés.","Faire revenir la viande hachée dans l'huile en l'émiettant jusqu'à ce qu'il n'y ait plus de rose.","Ajouter les légumes et les tomates et laisser mijoter 15 minutes.","Cuire les spaghetti, assaisonner la sauce."],"","Bien cuire la viande hachée."],
"gnocchi":["Poêlée de gnocchis aux épinards et mozzarella",["Faire dorer les gnocchis 6 à 8 minutes dans l'huile.","Ajouter les épinards lavés et les tomates coupées en deux, laisser tomber.","Effilocher la mozzarella, la répartir dessus et la faire fondre à couvert."],"",""],
"quinoabowl":["Bowl de quinoa aux pois chiches",["Rincer le quinoa à l'eau chaude et le cuire 15 minutes dans 300 ml d'eau.","Rincer les pois chiches, couper le poivron et le concombre en dés.","Mélanger le yaourt avec le jus de citron et le sel.","Dresser le tout dans des bols, arroser d'huile."],"Le poivron et le citron apportent de la vitamine C, le fer est ainsi mieux absorbé.",""],
"kartoffelsuppe":["Soupe de pommes de terre douce",["Éplucher les pommes de terre et les carottes et les couper en dés, bien laver le poireau et le couper en rondelles.","Cuire 20 minutes dans le bouillon jusqu'à ce que ce soit tendre.","Ajouter le lait, mixer grossièrement et assaisonner de muscade et de sel."],"Douce et peu grasse, bien en cas de brûlures d'estomac.",""],
"nudelsuppe":["Soupe de poulet aux vermicelles",["Faire frémir le poulet 15 minutes dans le bouillon, le retirer et l'effilocher.","Ajouter les carottes et le poireau en rondelles au bouillon, cuire 5 minutes.","Ajouter les vermicelles et cuire selon le paquet, remettre la viande."],"Chaude, douce et salée, souvent bien tolérée en cas de nausées.","Bien cuire le poulet."],
"halloumi":["Légumes rôtis au halloumi",["Préchauffer le four à 200 °C.","Couper les légumes en morceaux, les mélanger avec l'huile et le paprika et cuire 20 minutes.","Ajouter le halloumi en tranches et cuire encore 10 minutes."],"Le halloumi se mange chauffé, il est donc sans risque.",""],
"pflaumenjoghurt":["Yaourt aux pruneaux et graines de lin",["Couper les pruneaux en petits morceaux.","Mélanger avec le yaourt et les graines de lin.","Boire un grand verre d'eau avec."],"Les graines de lin ne gonflent qu'avec assez de liquide, d'où le verre d'eau.",""],
"apfelerdnuss":["Quartiers de pomme au beurre de cacahuète",["Laver les pommes et les couper en quartiers.","Servir avec le beurre de cacahuète pour tremper."],"",""],
"kernmix":["Mélange de graines et fruits secs",["Faire griller les graines 3 minutes à sec dans une poêle et laisser refroidir.","Mélanger avec les raisins secs et les abricots coupés en petits morceaux.","Mettre dans un bocal, une petite poignée fait une portion."],"Sans fruits à coque, donc adapté en cas d'allergie aux noix.",""],
"ingwertee":["Infusion de gingembre au miel",["Éplucher le gingembre et le couper en fines rondelles.","Verser 500 ml d'eau bouillante dessus et laisser infuser 8 minutes.","Sucrer avec du miel. Tiède ou froide, elle passe souvent mieux en cas de nausées."],"Le gingembre en quantités normales est considéré sans risque. Pas de gélules de gingembre fortement dosées sans avis médical.",""],
"bananenmilch":["Lait banane-avoine",["Mixer finement le tout.","Boire aussitôt."],"Le lait et les flocons d'avoine soulagent beaucoup de femmes en cas de brûlures d'estomac.",""],
"bircher":["Bircher muesli à la pomme",["Mélanger les flocons d'avoine avec le lait et laisser une nuit au réfrigérateur.","Le matin, râper grossièrement la pomme avec la peau et l'incorporer avec le yaourt.","Sucrer avec du miel et parsemer de graines de courge."],"",""],
"chiapudding":["Pudding de chia à la mangue",["Mélanger les graines de chia avec le lait et le miel, remuer à nouveau après 10 minutes.","Laisser gonfler une nuit au réfrigérateur.","Éplucher la mangue, la couper en dés et la poser sur le pudding."],"Les graines de chia gonflent beaucoup. Boire un verre d'eau avec.",""],
"skyrbowl":["Bol de skyr, banane et graines",["Répartir le skyr dans deux bols.","Couper la banane en rondelles et les poser dessus.","Parsemer de graines, de flocons d'avoine et de miel."],"",""],
"waffeln":["Gaufres complètes",["Mélanger les œufs, le lait, le sucre et l'huile, incorporer la farine et la levure.","Cuire dans le gaufrier chaud jusqu'à ce qu'elles soient dorées et bien cuites.","Servir avec du yaourt et des fruits."],"Congeler : laisser refroidir les gaufres restantes, les congeler une par une et les réchauffer au grille-pain.","Ne pas goûter la pâte crue, elle contient des œufs crus."],
"ruehreiwrap":["Wrap aux œufs brouillés et poivron",["Couper le poivron en petits dés et le faire revenir 2 minutes dans l'huile.","Ajouter les œufs battus et remuer jusqu'à ce que tout soit ferme.","Réchauffer brièvement les wraps, ajouter les œufs brouillés et le fromage râpé, rouler."],"","Bien cuire les œufs brouillés, plus rien ne doit être liquide."],
"quarkbroetchen":["Petits pains rapides au fromage blanc",["Préchauffer le four à 180 °C.","Mélanger le fromage blanc, l'œuf et le sel, incorporer la farine et la levure en pétrissant.","Former 8 petits pains, parsemer de graines et cuire 20 à 25 minutes."],"Congeler : congeler une fois refroidis et réchauffer 8 minutes à 180 °C.",""],
"griessbrei":["Semoule au lait et coulis chaud de fruits rouges",["Porter le lait à ébullition, verser la semoule et laisser gonfler 5 minutes en remuant.","Faire bouillir les fruits rouges surgelés 2 minutes dans une petite casserole et sucrer avec du miel.","Servir la semoule avec le coulis chaud."],"","Toujours faire bouillir brièvement les fruits rouges surgelés."],
"kaesetoast":["Toast gratiné fromage-tomate",["Griller le pain et le garnir de rondelles de tomate.","Poser le fromage dessus, parsemer d'origan.","Gratiner 4 à 5 minutes au four ou au grill."],"",""],
"tomatenruehrei":["Œufs brouillés tomate et ciboulette",["Couper les tomates en dés et les faire revenir brièvement dans l'huile.","Ajouter les œufs battus et remuer jusqu'à ce qu'ils soient bien fermes.","Servir avec la ciboulette lavée et du pain."],"","Bien cuire les œufs."],
"apfelporridge":["Porridge pomme-cannelle",["Couper la pomme en petits dés et porter à ébullition avec le lait et les flocons d'avoine.","Laisser gonfler 4 minutes à feu doux en remuant.","Assaisonner de cannelle et de miel."],"",""],
"erdnusstoast":["Toast complet beurre de cacahuète et banane",["Griller le pain et le tartiner finement de beurre de cacahuète.","Poser la banane en rondelles dessus et saupoudrer de cannelle."],"",""],
"bananensmoothie":["Smoothie banane-yaourt aux myrtilles",["Bien laver les myrtilles.","Mixer finement le tout.","Boire aussitôt."],"","Bien laver les fruits rouges frais. Les fruits rouges surgelés seulement cuits."],
"huettenkaese":["Pain complet, cottage cheese et radis",["Bien laver les radis et la ciboulette et les couper en petits morceaux.","Les mélanger au cottage cheese et saler.","Tartiner sur le pain."],"",""],
"schokooats":["Overnight oats au chocolat",["Mélanger les flocons d'avoine, le lait, le cacao et le miel dans deux bocaux.","Laisser une nuit au réfrigérateur.","Le matin, garnir de rondelles de banane."],"",""],
"avocadotomate":["Pain complet avocat et tomate",["Écraser l'avocat avec un peu de jus de citron et de sel.","Tartiner sur le pain et garnir de rondelles de tomate."],"",""],
"haehnchencurry":["Curry de poulet express aux petits pois",["Cuire le riz selon le paquet.","Couper le poulet en dés et le faire revenir avec l'oignon dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Ajouter le curry et faire griller brièvement, ajouter le lait de coco et les petits pois et laisser mijoter 5 minutes."],"","Bien cuire le poulet. Cuire les petits pois surgelés, ne pas les manger crus."],
"putenbrokkoli":["Poêlée de dinde au brocoli et pâtes",["Cuire les pâtes, ajouter le brocoli les 4 dernières minutes.","Faire revenir la dinde en lanières dans l'huile jusqu'à ce qu'elle soit blanche à l'intérieur. Ajouter l'ail brièvement.","Ajouter les pâtes et le brocoli et mélanger avec la sauce soja."],"","Bien cuire la dinde."],
"gnocchitomate":["Gnocchis sauce tomate-mozzarella",["Faire revenir l'ail dans l'huile, ajouter les tomates et l'origan, laisser mijoter 5 minutes.","Cuire les gnocchis directement dans la sauce 3 à 4 minutes.","Effilocher la mozzarella, la répartir dessus et la faire fondre à couvert."],"",""],
"thunfischwrap":["Wraps thon-maïs",["Égoutter le thon, le mélanger avec le maïs et le yaourt et saler.","Laver la salade, couper le poivron en lanières.","Répartir le tout sur les wraps et rouler."],"","Thon au maximum environ 1 fois par semaine à cause du mercure."],
"thunfischbowl":["Bowl de riz au thon et concombre",["Cuire le riz selon le paquet et le laisser un peu refroidir.","Couper le concombre et l'avocat en dés, égoutter le thon.","Dresser le tout sur le riz, arroser de sauce soja et de jus de citron."],"","Le thon en boîte est cuit. Au maximum environ 1 fois par semaine (mercure)."],
"tortellini":["Tortellini sauce tomate-crème",["Cuire les tortellini selon le paquet.","Porter les tomates à ébullition avec la crème et saler.","Faire tomber les épinards lavés dans la sauce, incorporer les tortellini."],"Les tortellini du rayon frais sont sûrs car ils sont cuits.",""],
"quesadillas":["Quesadillas au poulet",["Couper le poulet en petits dés, assaisonner et le faire revenir dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Couper le poivron en dés, râper le fromage.","Répartir poulet, légumes et fromage sur deux wraps, couvrir chacun d'un autre wrap.","Cuire à la poêle 2 à 3 minutes de chaque côté, jusqu'à ce que le fromage fonde."],"","Bien cuire le poulet."],
"couscoussalat":["Salade de couscous à la feta et au concombre",["Verser 200 ml d'eau bouillante sur le couscous et laisser gonfler 5 minutes.","Couper le concombre et les tomates en dés, laver et hacher le persil.","Mélanger le tout avec le jus de citron, l'huile et le sel, émietter la feta par-dessus."],"","Feta au lait pasteurisé, bien laver les herbes."],
"hackreispfanne":["Poêlée de riz à la viande hachée et aux légumes",["Cuire le riz selon le paquet.","Faire revenir la viande hachée dans l'huile en l'émiettant jusqu'à ce qu'il n'y ait plus de rose.","Couper les légumes en dés, les ajouter et faire sauter 5 minutes.","Incorporer le riz et assaisonner."],"","Bien cuire la viande hachée."],
"brokkolinudeln":["Pâtes complètes sauce brocoli-fromage frais",["Cuire les pâtes, ajouter le brocoli les 5 dernières minutes.","Chauffer le fromage frais avec le lait, assaisonner de muscade et de sel.","Égoutter les pâtes et le brocoli, mélanger avec la sauce et parsemer de parmesan."],"",""],
"friedrice":["Riz sauté à l'œuf et aux légumes",["Cuire le riz et l'étaler pour qu'il refroidisse un peu.","Couper la carotte en dés et la faire sauter 4 minutes dans l'huile avec les petits pois.","Ajouter les œufs et remuer jusqu'à ce qu'ils soient fermes.","Ajouter le riz et la sauce soja et faire bien chauffer le tout."],"","Riz de la veille seulement s'il a été mis au réfrigérateur dans l'heure. Bien cuire les œufs."],
"asianudeln":["Nouilles chinoises à la dinde et aux légumes",["Préparer les nouilles selon le paquet.","Faire revenir la dinde en lanières dans l'huile jusqu'à ce qu'elle soit blanche à l'intérieur.","Ajouter les légumes en lanières et le gingembre râpé, faire sauter 4 minutes.","Incorporer les nouilles et la sauce soja."],"","Bien cuire la dinde."],
"falafelpita":["Pita aux falafels et sauce yaourt",["Réchauffer les falafels bien chauds au four ou à la poêle selon le paquet.","Mélanger le yaourt avec l'ail pressé et le sel.","Laver et couper les légumes, réchauffer brièvement la pita et la garnir."],"",""],
"fetapasta":["Pâtes à la feta rôtie et aux tomates",["Préchauffer le four à 200 °C. Mettre les tomates dans un plat, la feta au milieu.","Cuire 25 minutes avec l'huile, l'ail et l'origan.","Pendant ce temps, cuire les pâtes. Écraser la feta et les tomates, incorporer les pâtes et les épinards lavés."],"",""],
"spinatpfannkuchen":["Crêpes salées aux épinards",["Mélanger la farine, les œufs, le lait et le sel en une pâte lisse.","Cuire de fines crêpes dans l'huile jusqu'à ce qu'elles soient cuites des deux côtés.","Chauffer les épinards, les mélanger avec le fromage frais et la muscade et en garnir les crêpes."],"","Bien cuire les crêpes. Chauffer les épinards surgelés."],
"zucchinipuffer":["Galettes de courgette et dip au yaourt",["Râper grossièrement la courgette, saler, laisser dégorger 5 minutes et bien presser.","Mélanger avec les œufs, la farine et le parmesan.","Cuire de petites galettes dans l'huile 3 à 4 minutes de chaque côté, jusqu'à ce qu'elles soient dorées et cuites.","Mélanger le yaourt avec l'ail et le sel et servir avec."],"","Bien cuire les galettes, plus humides à l'intérieur."],
"shakshuka":["Chakchouka aux œufs bien pris",["Couper l'oignon et le poivron en dés et les faire revenir 5 minutes dans l'huile.","Ajouter les tomates et les épices et laisser mijoter 8 minutes.","Former quatre creux et y faire glisser les œufs.","Cuire 10 minutes à couvert, jusqu'à ce que blanc et jaune soient bien fermes."],"","Le jaune doit être bien ferme, pas coulant comme dans l'original."],
"tortilla":["Tortilla espagnole aux pommes de terre",["Couper les pommes de terre en fines rondelles et les faire revenir 15 minutes avec l'oignon dans l'huile jusqu'à ce qu'elles soient tendres.","Battre les œufs, saler et les verser dessus.","Laisser prendre 10 minutes à couvert à feu doux, retourner et cuire encore 5 minutes jusqu'à ce qu'elle soit bien ferme."],"Se mange aussi froide le lendemain. Conserver au réfrigérateur.","La tortilla doit être complètement prise au centre."],
"flammkuchen":["Tarte flambée au jambon cuit",["Préchauffer le four à 220 °C, dérouler la pâte sur la plaque.","Mélanger la crème épaisse avec le sel et la muscade et l'étaler finement.","Couper l'oignon en rondelles, le jambon en lanières, répartir le tout.","Cuire 12 à 15 minutes jusqu'à ce que ce soit croustillant."],"","Jambon cuit à la place des lardons crus de l'original."],
"kaesespaetzle":["Spätzle au fromage et oignons frits",["Couper les oignons en rondelles et les faire dorer dans l'huile.","Disposer les spätzle en couches avec le fromage râpé dans un plat à gratin.","Gratiner 10 minutes à 200 °C, servir avec les oignons et la ciboulette."],"Une salade verte va bien avec.",""],
"gulasch":["Goulasch de bœuf et pommes de terre",["Faire bien dorer la viande dans l'huile en plusieurs fois.","Couper les oignons et le poivron en dés, les faire revenir, ajouter le concentré de tomates et le paprika et faire griller brièvement.","Déglacer avec le bouillon et laisser mijoter 90 minutes à couvert jusqu'à ce que la viande soit tendre.","Cuire les pommes de terre et servir avec."],"Congeler : cuire le double, congeler en portions. Décongeler au réfrigérateur et réchauffer jusqu'à ce que ce soit fumant.","Bien cuire la viande."],
"chiliconcarne":["Chili con carne doux",["Faire revenir la viande hachée dans l'huile en l'émiettant jusqu'à ce qu'il n'y ait plus de rose.","Couper les oignons et le poivron en dés et les faire revenir avec.","Ajouter les tomates et les épices et laisser mijoter 25 minutes.","Ajouter les haricots et le maïs, laisser mijoter encore 5 minutes. Servir avec du riz."],"Congeler : donne 4 portions. En congeler la moitié, réchauffer jusqu'à ce que ce soit fumant après décongélation.","Bien cuire la viande hachée."],
"linseneintopf":["Potée de lentilles aux saucisses",["Couper les légumes et les pommes de terre en dés, bien laver le poireau.","Porter à ébullition avec les lentilles et le bouillon et laisser mijoter 30 minutes.","Couper les saucisses en rondelles, les faire bien chauffer 5 minutes dans la potée.","Assaisonner de vinaigre et de sel."],"Congeler : congeler sans les saucisses, en ajouter des fraîches en réchauffant.","Bien faire chauffer les saucisses dans la potée."],
"erbsensuppe":["Soupe de pois cassés",["Couper l'oignon, les carottes et les pommes de terre en dés.","Porter à ébullition avec les pois cassés et le bouillon et laisser mijoter 40 minutes, jusqu'à ce que les pois se défassent.","Assaisonner de marjolaine et de sel, mixer grossièrement si on veut."],"Congeler : congeler en portions. Ajouter un peu d'eau en réchauffant.",""],
"kuerbissuppe":["Velouté de potimarron au lait de coco",["Laver le potimarron, l'épépiner et le couper en dés avec la peau.","Le cuire 20 minutes dans le bouillon avec l'oignon et le gingembre.","Ajouter le lait de coco, mixer finement et assaisonner. Parsemer de graines de courge grillées."],"Congeler : congeler sans les graines de courge. Doux et bien toléré en cas de brûlures d'estomac.",""],
"minestrone":["Minestrone aux haricots",["Couper les légumes en dés, bien laver le poireau, faire revenir le tout 5 minutes dans l'huile.","Ajouter les tomates et le bouillon et laisser mijoter 15 minutes.","Ajouter les haricots et les pâtes, cuire jusqu'à ce que les pâtes soient tendres.","Parsemer de parmesan."],"Congeler : congeler sans les pâtes, sinon elles ramollissent. Les ajouter fraîches en réchauffant.",""],
"frikassee":["Fricassée de poulet et riz",["Faire frémir le poulet 15 minutes dans le bouillon, le retirer et le couper en dés. Garder le bouillon.","Faire fondre le beurre, incorporer la farine, ajouter peu à peu le bouillon et la crème.","Cuire les champignons, la carotte et les petits pois 8 minutes dans la sauce, remettre la viande, assaisonner de citron.","Servir avec du riz."],"Congeler : congeler la fricassée sans riz, en portions.","Bien cuire le poulet."],
"lasagne":["Lasagnes au bœuf haché",["Faire revenir la viande hachée en l'émiettant jusqu'à ce qu'il n'y ait plus de rose. Ajouter l'oignon et la carotte en petits dés, puis les tomates, et laisser mijoter 15 minutes.","Faire fondre le beurre, incorporer la farine, ajouter peu à peu le lait et cuire en béchamel, assaisonner de muscade.","Alterner sauces et feuilles dans un plat, finir par la béchamel et la mozzarella.","Cuire 40 minutes à 180 °C."],"Congeler : congeler en portions et réchauffer 30 minutes au four à 180 °C, jusqu'à ce que ce soit chaud à cœur.","Bien cuire la viande hachée."],
"gemueselasagne":["Lasagnes épinards-ricotta",["Décongeler les épinards, bien les presser, mélanger avec la ricotta, l'ail, la muscade et le sel.","Saler les tomates.","Alterner feuilles, épinards-ricotta et tomates, finir par la mozzarella.","Cuire 40 minutes à 180 °C."],"Congeler : congeler en portions, réchauffer à cœur au four.",""],
"hackbaellchen":["Boulettes de viande sauce tomate et pâtes",["Pétrir la viande hachée avec l'œuf, la chapelure et le sel et former de petites boulettes.","Les dorer dans l'huile, ajouter l'oignon, puis les tomates et l'origan.","Laisser mijoter 15 minutes à couvert, jusqu'à ce que les boulettes soient cuites à cœur.","Servir avec des spaghetti."],"Congeler : congeler les boulettes avec la sauce en portions.","Bien cuire les boulettes, plus rosées à l'intérieur."],
"kartoffelhackauflauf":["Gratin pommes de terre-viande hachée",["Précuire 10 minutes les pommes de terre en rondelles.","Faire revenir la viande hachée avec l'oignon en l'émiettant jusqu'à ce qu'il n'y ait plus de rose, assaisonner.","Alterner pommes de terre, viande et petits pois dans un plat, verser la crème, râper le fromage par-dessus.","Cuire 30 minutes à 200 °C."],"Congeler : en portions, bien réchauffer au four.","Bien cuire la viande hachée."],
"schinkennudeln":["Gratin de pâtes au jambon cuit et petits pois",["Cuire les pâtes, ajouter les petits pois les 2 dernières minutes.","Couper le jambon en dés et le mettre dans un plat avec les pâtes et les petits pois.","Battre les œufs avec le lait, la muscade et le sel, verser dessus, râper le fromage par-dessus.","Cuire 25 minutes à 190 °C, jusqu'à ce que l'appareil soit complètement pris."],"Congeler : congeler en portions une fois refroidi.","L'appareil aux œufs doit être complètement ferme."],
"kichererbseneintopf":["Ragoût oriental de pois chiches",["Couper l'oignon et la patate douce en dés et les faire revenir 5 minutes dans l'huile, ajouter les épices et faire griller brièvement.","Ajouter les tomates, le bouillon et les pois chiches rincés et laisser mijoter 20 minutes.","Incorporer les épinards lavés jusqu'à ce qu'ils tombent."],"Congeler : congeler sans les épinards, les ajouter frais en réchauffant.",""],
"dal":["Dal de lentilles corail aux épinards",["Hacher finement l'oignon et le gingembre, les faire revenir dans un peu de lait de coco, ajouter le curry.","Ajouter les lentilles, les tomates, le reste du lait de coco et 300 ml d'eau et laisser mijoter 15 minutes.","Incorporer les épinards et chauffer. Servir avec du riz."],"Congeler : congeler le dal en portions, cuire le riz frais.",""],
"gefuelltepaprika":["Poivrons farcis à la viande hachée et au riz",["Cuire le riz à moitié.","Faire revenir la viande hachée avec l'oignon en l'émiettant jusqu'à ce qu'il n'y ait plus de rose, mélanger avec le riz et les épices.","Évider les poivrons, les farcir et les mettre dans un plat avec les tomates.","Râper le fromage dessus et cuire 35 minutes à 190 °C."],"Congeler : congeler farcis et cuits, réchauffer à cœur au four.","Bien cuire la viande hachée au préalable."],
"geschnetzeltes":["Émincé de porc aux champignons",["Cuire les pâtes.","Couper la viande en fines lanières et la saisir à feu vif dans l'huile jusqu'à ce qu'elle ne soit plus rosée à l'intérieur. Réserver.","Faire revenir l'oignon et les champignons 5 minutes dans la même cocotte.","Ajouter le bouillon et la crème, porter brièvement à ébullition, remettre la viande."],"","Bien cuire le porc. Sans le vin blanc de la recette d'origine."],
"schweinefilet":["Filet mignon de porc et légumes rôtis",["Préchauffer le four à 200 °C. Couper les pommes de terre et les légumes en morceaux, les mettre sur la plaque avec l'huile et le sel.","Cuire 20 minutes.","Assaisonner le filet, le dorer de tous côtés et le poser sur la plaque.","Cuire encore 15 à 20 minutes, jusqu'à ce que la viande ne soit plus rosée à l'intérieur."],"","Le filet mignon est souvent servi rosé. Pendant la grossesse, bien le cuire (clair à l'intérieur)."],
"haehnchenkeulen":["Cuisses de poulet et pommes de terre au four",["Préchauffer le four à 200 °C.","Mélanger les cuisses et les quartiers de pommes de terre avec l'huile, le paprika, l'origan et le sel et les mettre sur la plaque.","Cuire 45 minutes, jusqu'à ce que la peau soit croustillante et qu'aucun jus rosé ne sorte près de l'os.","Servir avec une salade de concombre."],"","Bien cuire le poulet, même près de l'os."],
"teriyaki":["Poulet teriyaki, riz et brocoli",["Cuire le riz, cuire le brocoli à la vapeur au-dessus du riz les 5 dernières minutes ou à part.","Faire revenir le poulet en morceaux dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Ajouter la sauce soja, le miel et le gingembre râpé et laisser réduire jusqu'à ce que tout brille."],"","Bien cuire le poulet."],
"gyrospfanne":["Poêlée de poulet façon gyros et tzatziki",["Couper le poulet en lanières, le mélanger avec les épices et le faire revenir avec les oignons dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Râper le concombre, le presser et le mélanger avec le yaourt et l'ail pour faire le tzatziki.","Servir avec du pain pita chaud."],"","Bien cuire le poulet. Tzatziki au yaourt pasteurisé."],
"rindbrokkoli":["Bœuf au brocoli à l'asiatique",["Cuire le riz.","Mélanger la viande avec la fécule et la saisir à feu vif dans l'huile chaude jusqu'à ce qu'elle soit cuite. Réserver.","Cuire le brocoli 4 minutes avec l'ail, le gingembre et 50 ml d'eau.","Ajouter la viande et la sauce soja et faire sauter brièvement."],"Le bœuf apporte du fer bien assimilable, le brocoli de la vitamine C.","Bien cuire le bœuf."],
"burritobowl":["Burrito bowl à la viande hachée et aux haricots",["Cuire le riz.","Faire revenir la viande hachée en l'émiettant jusqu'à ce qu'il n'y ait plus de rose, ajouter les haricots et les épices et chauffer.","Couper l'avocat et les tomates en dés.","Dresser le tout dans des bols, servir avec la crème épaisse."],"","Bien cuire la viande hachée."],
"tacos":["Tacos au poulet",["Couper le poulet en petits morceaux, assaisonner et le faire revenir dans l'huile jusqu'à ce qu'il soit blanc à l'intérieur.","Couper le poivron en dés, laver la salade et la couper en lanières, râper le fromage.","Réchauffer les tortillas et les garnir, servir avec du yaourt."],"","Bien cuire le poulet."],
"zitronenhaehnchen":["Poulet au citron à la grecque et pommes de terre",["Préchauffer le four à 200 °C.","Mélanger les quartiers de pommes de terre avec l'huile, le jus de citron, l'ail, l'origan et le sel et cuire 25 minutes.","Ajouter le poulet et cuire encore 20 à 25 minutes, jusqu'à ce qu'il soit blanc à l'intérieur."],"","Bien cuire le poulet."],
"pastafagioli":["Soupe pâtes-haricots (pasta e fagioli)",["Couper finement l'oignon et la carotte en dés et les faire revenir dans l'huile.","Ajouter les tomates, le bouillon et les haricots rincés, laisser mijoter 10 minutes, mixer un tiers.","Y cuire les pâtes et servir avec du parmesan."],"Congeler : congeler sans les pâtes.",""],
"kartoffelgulasch":["Goulasch de pommes de terre aux saucisses",["Couper les oignons et le poivron en dés et les faire revenir dans l'huile, ajouter le concentré de tomates et le paprika et faire griller brièvement.","Ajouter les pommes de terre en dés et le bouillon et laisser mijoter 20 minutes.","Faire bien chauffer les saucisses en rondelles 5 minutes dans le goulasch."],"Congeler : en portions. Les pommes de terre ramollissent un peu, mais c'est bon quand même.","Bien faire chauffer les saucisses."],
"onepothaehnchen":["Poulet, riz et légumes en one pot",["Couper le poulet en dés et le faire dorer dans l'huile.","Ajouter le riz, les épices et le bouillon, laisser mijoter 15 minutes à couvert.","Ajouter les légumes et les petits pois et cuire encore 10 minutes, jusqu'à ce que le riz et la viande soient cuits."],"Une seule casserole, peu de vaisselle.","Bien cuire le poulet."],
"putenfrikadellen":["Boulettes de dinde, couscous et concombre",["Pétrir la viande hachée avec l'œuf, la chapelure, l'oignon finement haché et le sel et former 8 galettes.","Les cuire dans l'huile 5 à 6 minutes de chaque côté, jusqu'à ce qu'elles soient cuites à cœur.","Laisser gonfler le couscous avec 200 ml d'eau bouillante.","Servir avec des rondelles de concombre et du yaourt."],"Congeler : congeler les galettes cuites, réchauffer bien chaud à la poêle ou au four.","Bien cuire la volaille hachée."],
"kuerbisrisotto":["Risotto au potimarron",["Couper le potimarron en petits dés, hacher l'oignon et faire revenir dans l'huile.","Ajouter le riz et le laisser devenir translucide.","Verser peu à peu le bouillon chaud et cuire 20 minutes en remuant.","Incorporer le beurre et le parmesan."],"","Sans le vin blanc de la recette d'origine."],
"quiche":["Quiche aux légumes",["Préchauffer le four à 190 °C, foncer un moule avec la pâte.","Couper les légumes en petits morceaux, les faire revenir brièvement et les répartir sur la pâte.","Battre les œufs avec le lait, le fromage râpé, la muscade et le sel et verser dessus.","Cuire 40 minutes, jusqu'à ce que l'appareil soit bien ferme au centre."],"Congeler : congeler en parts et réchauffer au four.","L'appareil aux œufs doit être complètement pris au centre."],
"frikadellen":["Boulettes de viande, purée et carottes",["Pétrir la viande hachée avec l'œuf, la chapelure, l'oignon finement haché et le sel, former 8 galettes.","Les cuire dans l'huile 5 à 6 minutes de chaque côté, jusqu'à ce qu'elles ne soient plus rosées à l'intérieur.","Cuire les pommes de terre et les carottes, écraser les pommes de terre avec le lait chaud."],"Congeler : congeler les galettes cuites une par une.","Bien cuire les galettes de viande."],
"haehnchenburger":["Burger au poulet croustillant",["Aplatir le poulet, saler, le passer dans l'œuf battu puis dans la chapelure.","Le cuire dans l'huile 4 à 5 minutes de chaque côté, jusqu'à ce qu'il soit blanc à l'intérieur.","Toaster les pains, garnir de yaourt, salade, tomate et poulet."],"","Bien cuire le poulet. La panure à l'œuf cuit avec."],
"thunfischauflauf":["Gratin de pâtes au thon",["Cuire les pâtes.","Les mélanger avec les tomates, le thon égoutté, le maïs et le poivron en dés.","Mettre dans un plat, râper le fromage dessus et cuire 20 minutes à 200 °C."],"Congeler : en portions, réchauffer à cœur au four.","Thon au maximum environ 1 fois par semaine à cause du mercure."],
"haehnchenschnitzel":["Escalope de poulet panée, salade pommes de terre-concombre",["Cuire les pommes de terre, les éplucher et les couper en rondelles. Couper le concombre à la mandoline.","Mélanger la mayonnaise avec le yaourt, l'aneth lavé et le sel, puis avec les pommes de terre et le concombre.","Aplatir le poulet, le passer dans l'œuf et la chapelure et le cuire dans l'huile 4 minutes de chaque côté, jusqu'à ce qu'il soit blanc à l'intérieur."],"","Mayonnaise en pot, pas maison. Garder la salade au frais et la manger le jour même."],
"bananenbrot":["Banana bread moelleux",["Préchauffer le four à 175 °C, graisser un moule à cake.","Écraser les bananes, mélanger avec les œufs, l'huile et le sucre.","Incorporer la farine, la levure et la cannelle.","Cuire 50 à 55 minutes, jusqu'à ce qu'une pique en bois ressorte propre."],"Congeler : congeler en tranches et les laisser décongeler une par une ou les griller.","Ne pas goûter la pâte crue (œufs crus)."],
"schokomuffins":["Muffins chocolat-banane",["Préchauffer le four à 180 °C.","Écraser les bananes, mélanger avec les œufs, le lait, l'huile et le sucre.","Incorporer la farine, le cacao et la levure, puis le chocolat haché.","Remplir 12 moules et cuire 20 minutes."],"Congeler : congeler une fois refroidis, décongeler à température ambiante.","Ne pas goûter la pâte crue (œufs crus)."],
"brownies":["Brownies moelleux à l'épeautre",["Préchauffer le four à 180 °C, chemiser un petit moule.","Faire fondre le chocolat et le beurre.","Mélanger les œufs avec le sucre, incorporer le chocolat, la farine et le cacao.","Cuire 20 à 22 minutes, jusqu'à ce que le centre soit ferme."],"Le chocolat contient un peu de caféine. Un morceau par jour ne pose pas de problème.","Bien cuire. Pendant la grossesse, pas de brownies encore coulants à l'intérieur (œuf cru)."],
"schokojoghurt":["Yaourt au chocolat et banane",["Lisser le yaourt avec le cacao et le miel.","Poser la banane en rondelles dessus."],"",""],
"schokobananen":["Bananes enrobées de chocolat",["Couper les bananes en deux et les piquer sur des bâtonnets en bois.","Faire fondre le chocolat, y tremper les bananes et parsemer de noix de coco.","Congeler 2 heures sur du papier cuisson."],"",""],
"kokosbaellchen":["Boules coco-avoine",["Moudre finement les flocons d'avoine au mixeur.","Ajouter les dattes, le beurre de cacahuète et le cacao et mixer jusqu'à obtenir une pâte collante.","Former des boules et les rouler dans la noix de coco. Se conservent une semaine au réfrigérateur."],"Sans noix, adapté en cas d'allergie aux noix.",""],
"joghurtbark":["Tablette glacée yaourt-fruits rouges",["Faire bouillir les fruits rouges surgelés 2 minutes et laisser refroidir.","Mélanger le yaourt avec le miel et l'étaler sur une plaque couverte de papier cuisson, sur l'épaisseur d'un doigt.","Répartir les fruits rouges et les graines de courge dessus et congeler 3 heures.","Casser en morceaux et grignoter congelé."],"","Faire bouillir les fruits rouges surgelés avant."],
"mangoeis":["Glace mangue-yaourt",["Éplucher la mangue et mixer la chair avec le yaourt et le miel.","Verser dans des moules à glace et congeler au moins 4 heures."],"",""],
"apfelwrap":["Wrap chaud pomme-cannelle",["Couper les pommes en petits dés et les faire compoter 5 minutes avec le beurre, la cannelle et le miel.","Tartiner les wraps de fromage blanc, ajouter les pommes, rouler.","Faire dorer brièvement à la poêle des deux côtés."],"Presque comme un strudel aux pommes.",""],
"zimtschnecken":["Roulés à la cannelle (pâte fromage blanc-huile)",["Préchauffer le four à 180 °C.","Mélanger le fromage blanc, le lait, l'huile et 30 g de sucre, incorporer la farine et la levure en pétrissant.","Étaler la pâte, badigeonner de beurre fondu, saupoudrer du reste de sucre mélangé à la cannelle.","Rouler, couper en 10 tranches et cuire 20 à 25 minutes."],"Congeler : congeler cuits et réchauffer brièvement au four.",""],
"kaesekuchenmuffins":["Muffins façon cheesecake",["Préchauffer le four à 170 °C, préparer 12 moules à muffins.","Lisser tous les ingrédients avec un peu de zeste de citron.","Remplir et cuire 25 à 30 minutes, jusqu'à ce qu'ils soient fermes. Laisser refroidir dans le moule."],"Congeler : congeler une fois refroidis, décongeler au réfrigérateur.","Bien cuire, le centre doit être ferme."],
"fruchtgummi":["Bonbons gélifiés au jus de fruits",["Faire tremper la gélatine 5 minutes dans l'eau froide.","Chauffer le jus avec le miel (sans faire bouillir), essorer la gélatine et l'y dissoudre.","Verser dans de petits moules en silicone et laisser prendre 2 heures au réfrigérateur."],"Possible aussi avec de l'agar-agar végétal au lieu de la gélatine, il faut alors porter brièvement à ébullition.",""],
"fruchtspiesse":["Brochettes de fruits et dip au yaourt",["Bien laver les fruits et les couper en morceaux.","Les piquer sur des brochettes.","Mélanger le yaourt avec le miel et le servir pour tremper."],"",""],
"apfelchips":["Chips de pomme au four",["Préchauffer le four à 100 °C, chaleur tournante.","Laver les pommes, retirer le trognon et les couper en tranches très fines à la mandoline.","Les poser sur du papier cuisson, saupoudrer de cannelle et faire sécher environ 2 heures, porte du four entrouverte avec une cuillère en bois."],"Les conserver dans une boîte hermétique pour qu'elles restent croustillantes.",""],
"rotebetechips":["Chips de betterave et de patate douce",["Préchauffer le four à 160 °C.","Éplucher les légumes et les couper très finement à la mandoline.","Mélanger avec l'huile et le sel, les étaler côte à côte sur des plaques et cuire 25 à 30 minutes jusqu'à ce qu'elles soient croustillantes. Retirer les chips trop foncées."],"","Cuire jusqu'à doré plutôt que foncé (moins d'acrylamide). La betterave tache beaucoup, des gants aident."],
"tortillachips":["Chips de tortilla au four et guacamole",["Préchauffer le four à 180 °C. Couper les wraps en triangles, les badigeonner finement d'huile, saler et cuire 8 à 10 minutes.","Écraser l'avocat, mélanger avec la tomate en dés, le jus de citron et le sel."],"",""],
"pizzaschnecken":["Roulés pizza au jambon cuit",["Préchauffer le four à 200 °C.","Étaler la pâte, la tartiner de tomates, assaisonner d'origan.","Répartir le jambon en lanières et le fromage râpé dessus.","Rouler, couper en 12 tranches et cuire 15 à 18 minutes."],"Congeler : congeler cuits et réchauffer 8 minutes au four.",""],
"toastpizza":["Mini-pizzas sur pain de mie complet",["Tartiner le pain de tomates et assaisonner d'origan.","Couper le poivron en dés et le répartir dessus avec la mozzarella effilochée.","Cuire 8 à 10 minutes à 220 °C."],"",""],
"kartoffelspalten":["Quartiers de pommes de terre et fromage blanc aux herbes",["Préchauffer le four à 200 °C.","Laver les pommes de terre, les couper en quartiers, les mélanger avec l'huile, le paprika et le sel et cuire 30 minutes.","Lisser le fromage blanc avec un peu d'eau, la ciboulette lavée et le sel."],"","Cuire jusqu'à doré plutôt que foncé."],
"zucchinisticks":["Bâtonnets de courgette au parmesan au four",["Préchauffer le four à 220 °C.","Couper la courgette en bâtonnets, les passer dans l'œuf battu puis dans la chapelure mélangée au parmesan.","Cuire 18 à 20 minutes sur du papier cuisson, jusqu'à ce qu'ils soient dorés."],"",""],
"kaesecracker":["Crackers fromage-avoine",["Préchauffer le four à 180 °C.","Moudre grossièrement les flocons d'avoine, pétrir avec le fromage râpé, les graines, l'œuf et le sel.","Étaler finement entre deux feuilles de papier cuisson, couper en rectangles et cuire 15 à 18 minutes."],"",""],
"edamame":["Edamame au sel",["Cuire les edamame 5 minutes dans l'eau bouillante.","Égoutter et saupoudrer de sel iodé.","Sucer les fèves hors des cosses, ne pas manger les cosses."],"","Toujours cuire les edamame surgelés, ne pas les manger crus."],
"gemuesemuffins":["Muffins salés aux légumes",["Préchauffer le four à 180 °C.","Râper la carotte et la courgette, râper le fromage.","Mélanger les œufs, le yaourt et l'huile, ajouter la farine, la levure et le sel, incorporer les légumes et le fromage.","Cuire 25 minutes dans 12 moules."],"Congeler : pratique à emporter. Congelé dans le sac, décongelé au bout de 2 heures.",""],
"kraeuterquarkdip":["Bâtonnets de légumes et fromage blanc aux herbes",["Lisser le fromage blanc avec le lait, ciseler la ciboulette lavée et l'incorporer, saler.","Laver, éplucher et couper les légumes en bâtonnets."],"",""],
"minipaprika":["Mini-poivrons au fromage frais",["Laver les poivrons, les couper en deux et les épépiner.","Mélanger le fromage frais avec la ciboulette lavée et ciselée.","En garnir les moitiés de poivron."],"Le poivron apporte beaucoup de vitamine C.",""],
"radieschensalat":["Salade radis-concombre au vinaigre",["Laver les radis et le concombre et les couper en fines rondelles à la mandoline.","Mélanger avec le vinaigre, l'huile, l'aneth lavé et le sel.","Laisser mariner 10 minutes."],"",""],
"tomatensalat":["Salade de tomates au balsamique",["Laver les tomates et les couper en rondelles, l'oignon en fines rondelles.","Assaisonner de vinaigre, d'huile et de sel."],"Contre l'envie d'acide. En cas de brûlures d'estomac, mettre moins de vinaigre.",""],
"erdbeerquark":["Crème de fromage blanc aux fraises",["Bien laver les fraises et les couper en petits morceaux, en mixer la moitié.","Mélanger le fromage blanc avec le yaourt, le miel et la purée.","Ajouter le reste des fraises par-dessus."],"","Bien laver les fraises fraîches. Les fraises surgelées seulement cuites."],
"zwiebackteller":["Biscottes et compote de pommes",["Tartiner les biscottes de compote ou les y tremper."],"Sec, doux et légèrement sucré. Bien quand on a du mal à manger le matin.",""],
"hummusvariante":["Tartinade de lentilles corail sur pain complet",["Cuire les lentilles 12 minutes dans 250 ml d'eau et laisser refroidir.","Mixer avec le concentré de tomates, l'huile, le jus de citron, le paprika et le sel.","Tartiner sur le pain. Se conserve 3 jours au frais."],"Avec du citron, le fer des lentilles est mieux absorbé.",""],
"milchshake":["Milk-shake fraise-banane",["Bien laver les fraises.","Les mixer avec la banane et le lait."],"Fait maison plutôt qu'au café, où l'on utilise souvent de la glace à l'italienne.",""],
"eiersalatbrot":["Salade d'œufs sur pain complet",["Cuire les œufs durs 10 minutes, les passer sous l'eau froide, les écaler et les hacher.","Mélanger avec la mayonnaise, le yaourt, la ciboulette lavée et le sel.","Tartiner sur le pain."],"","Cuire les œufs bien durs. Mayonnaise en pot. Garder la salade d'œufs au frais et la manger dans la journée."],
"bagel":["Bagel complet, fromage frais et concombre",["Couper le bagel et le toaster brièvement.","Tartiner de fromage frais, garnir de rondelles de concombre et de ciboulette lavée."],"",""],
"croque":["Croque jambon-fromage au four",["Garnir le pain de jambon, de rondelles de tomate et de fromage.","Gratiner 6 à 8 minutes au four à 220 °C, jusqu'à ce que le fromage fonde."],"Acheter le jambon cuit le plus frais possible et le consommer rapidement.",""],
"bauernfruehstueck":["Poêlée paysanne au jambon cuit",["Cuire les pommes de terre (celles de la veille vont bien), les couper en rondelles.","Les faire dorer dans l'huile avec l'oignon et les dés de jambon.","Verser les œufs battus dessus et remuer jusqu'à ce qu'ils soient bien fermes. Parsemer de ciboulette."],"Idéal pour un brunch tardif le week-end.","Bien cuire les œufs. Garder les pommes de terre cuites de la veille au réfrigérateur."],
"hummusbrot":["Pain complet, houmous et tomate",["Tartiner le pain de houmous.","Poser des rondelles de tomate dessus, assaisonner d'un peu de jus de citron et de paprika."],"Le citron et la tomate apportent de la vitamine C, le fer des pois chiches est ainsi mieux absorbé.",""],
"capresebrot":["Tartine tomate-mozzarella au basilic",["Garnir le pain de rondelles de tomate et de mozzarella.","Ajouter le basilic lavé, arroser d'huile et saler."],"","Mozzarella au lait pasteurisé."],
"herzhafterbrei":["Porridge salé aux épinards et œuf au plat",["Faire mijoter les flocons d'avoine 5 minutes dans le bouillon, incorporer les épinards lavés.","Cuire les œufs au plat dans l'huile et les retourner jusqu'à ce que le jaune soit bien ferme.","Parsemer le porridge de parmesan et poser les œufs dessus."],"","Cuire l'œuf au plat des deux côtés jusqu'à ce que le jaune soit ferme."],
"fetaruehrei":["Œufs brouillés feta et poivron",["Couper le poivron en dés et le faire revenir 3 minutes dans l'huile.","Ajouter les œufs battus et remuer jusqu'à ce qu'ils soient bien fermes.","Émietter la feta par-dessus, servir avec du pain."],"","Bien cuire les œufs. Feta au lait pasteurisé."],
"pancakes":["Pancakes à l'épeautre et fruits rouges chauds",["Mélanger la farine, la levure, le sucre, l'œuf et le lait en une pâte épaisse.","Cuire de petits pancakes dans la poêle huilée, retourner quand des bulles se forment et bien cuire.","Faire bouillir les fruits rouges surgelés 2 minutes et les servir avec du yaourt sur les pancakes."],"","Bien cuire les pancakes. Faire bouillir les fruits rouges surgelés."],
"frenchtoast":["Pain perdu à la pomme et cannelle",["Battre les œufs avec le lait et la cannelle, y tremper le pain.","Cuire dans le beurre 3 minutes de chaque côté, jusqu'à ce que l'œuf soit complètement pris.","Servir avec des tranches de pomme et du miel."],"","Cuire le pain jusqu'à ce qu'il n'y ait plus d'œuf liquide à l'intérieur."],
"bakedoats":["Porridge cuit au four aux fruits rouges",["Préchauffer le four à 180 °C.","Écraser la banane, mélanger avec l'œuf, le lait, les flocons d'avoine, la levure et la cannelle.","Verser dans un petit plat, répartir les fruits rouges congelés dessus.","Cuire 25 minutes, jusqu'à ce que le centre soit ferme."],"Peut être cuit la veille et mangé froid ou brièvement réchauffé.","Bien cuire. Les fruits rouges sont chauffés en même temps."],
"kaiserschmarrn":["Kaiserschmarrn et compote de pommes",["Mélanger les œufs, la farine, le lait et le sucre, incorporer les raisins secs.","Cuire dans le beurre jusqu'à ce que le dessous soit ferme, couper en quatre, retourner.","Déchirer avec deux fourchettes et continuer à cuire jusqu'à ce que tout soit cuit et doré. Servir avec de la compote de pommes."],"","Bien cuire, plus humide à l'intérieur."],
"quinoafruehstueck":["Petit-déjeuner au quinoa, banane et cannelle",["Rincer le quinoa à l'eau chaude et le faire frémir 15 minutes dans le lait.","Assaisonner de cannelle et de miel.","Servir avec des rondelles de banane et des graines de courge."],"Le quinoa et les graines de courge apportent du fer et du magnésium.",""],
"granola":["Granola croustillant sans noix et yaourt",["Préchauffer le four à 160 °C.","Mélanger les flocons d'avoine, les graines et la noix de coco avec le miel et l'huile et étaler sur une plaque.","Cuire 20 minutes jusqu'à ce que ce soit doré, en retournant une fois, laisser refroidir.","Servir avec du yaourt et de la pomme. Garder le reste dans un bocal."],"Sans noix, adapté en cas d'allergie aux noix. Se conserve environ deux semaines en bocal.",""],
"smoothiebowl":["Smoothie bowl vert",["Bien laver les épinards.","Les mixer épais avec les bananes, le yaourt et le lait.","Verser dans des bols, parsemer de flocons d'avoine et de graines de courge."],"","Bien laver les épinards frais. Ne pas utiliser d'épinards surgelés crus."],
"pflaumenporridge":["Porridge aux pruneaux",["Couper les pruneaux en petits morceaux et les porter à ébullition avec les flocons d'avoine et le lait.","Laisser gonfler 4 minutes en remuant.","Parsemer de graines de lin et de cannelle. Boire un grand verre d'eau avec."],"",""],
