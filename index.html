<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bauchgefühl</title>
<meta name="description" content="Ernährung in der Schwangerschaft: Wochenbegleiter, Heißhunger-Alternativen, Lebensmittel-Ampel, Rezepte und Einkaufsliste.">
<meta name="theme-color" content="#4f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauchgefühl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App, feste Navigation unten, Rezepte öffnen als Blatt von unten */
:root{
  --bg:#f3f1ee; --fg:#26221f; --muted:#6c645d; --line:#ddd6cf;
  --surface:#ffffff; --card:#f7f4f1;
  --sage:#4f7a5c; --sage-soft:#e2ece4; --on-sage:#ffffff;
  --apricot:#c8662f; --apricot-soft:#fbe7da;
  --ok:#3f7d4a; --warn:#946509; --no:#b0413a;
  --ok-soft:#e1efe3; --warn-soft:#f6ecd4; --no-soft:#f6dedb;
  --shade:rgb(30 25 20 / .45);
  --water:#2f6f9a; --heart:#c2415e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1817; --fg:#efe9e4; --muted:#a99f97; --line:#3a3532;
  --surface:#24211f; --card:#2e2a28;
  --sage:#8bb898; --sage-soft:#2b3a2f; --on-sage:#13201a;
  --apricot:#eb9a66; --apricot-soft:#43301f;
  --ok:#87c493; --warn:#e0b45a; --no:#ea8a82;
  --ok-soft:#263829; --warn-soft:#3b3220; --no-soft:#422826;
  --shade:rgb(0 0 0 / .6); --water:#7fb8de; --heart:#ec7d96; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}

main{max-width:560px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head p{margin:4px 0 0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg)}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--sage);font-weight:600}

/* Karten & Bausteine */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-sage);font-weight:600}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--sage);color:var(--on-sage)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.small{padding:7px 12px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-no{background:var(--no-soft);color:var(--no)}
.nut-tag{font-size:12px;color:var(--sage);font-weight:600}
input[type=date],input[type=number],input[type=search],select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}

/* Heute */
.week{background:var(--sage-soft);border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.ring .track{stroke:var(--surface)} .ring .bar{stroke:var(--sage)}
.ring text{font-family:var(--display);font-weight:700;fill:var(--sage)}
.week .big{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.nut{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nut div{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13.5px;min-width:0}
.nut b{display:block;font-size:15px;color:var(--sage);margin-bottom:2px}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.meal:last-child{border-bottom:0}
.meal .slot{color:var(--muted);font-size:14px}
.meal .name{font-weight:500;min-width:0}
.meal .go{color:var(--muted)}
.supp{display:flex;flex-wrap:wrap;gap:8px}
.supp label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--surface);font-size:14px}
.supp input{width:18px;height:18px;accent-color:var(--sage)}
.tip{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px}

/* Lust auf */
.crave-q{background:var(--apricot-soft);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.crave-q h1{color:var(--apricot)}
.crave-q .chip{border-color:transparent}
.crave-q .chip[aria-pressed="true"]{background:var(--apricot);color:var(--surface)}
.swap{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.swap .from{color:var(--muted);text-decoration:line-through}
.swap .arrow{color:var(--apricot);font-weight:700}

/* Antwortkarte Lebensmittel-Suche */
.answer{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.answer .verdict{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.answer b{font-size:17px}
.answer small{color:var(--muted);font-size:13px}
.a-ok{background:var(--ok-soft)} .a-ok .verdict{color:var(--ok)}
.a-warn{background:var(--warn-soft)} .a-warn .verdict{color:var(--warn)}
.a-no{background:var(--no-soft)} .a-no .verdict{color:var(--no)}
.a-info{background:var(--card);border:1px solid var(--line)} .a-info .verdict{color:var(--muted);font-size:22px}
input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}

/* Deine Woche */
.wnav{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.wnav .wtitle{text-align:center;min-width:0}
.wnav .iconbtn{font-size:22px;line-height:1}
.wnav .iconbtn:disabled{opacity:.35}
.cmp{font-family:var(--display);font-size:18px;color:var(--apricot);text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.facts b{display:block;font-family:var(--display);font-size:17px;color:var(--fg)}
.ruler{position:relative;height:8px;background:var(--card);border-radius:9px;margin-bottom:14px}
.ruler i{position:absolute;left:0;top:0;bottom:0;background:var(--sage);border-radius:9px}
.ruler span{position:absolute;top:11px;font-size:11px;color:var(--muted)}
.ruler span:first-of-type{left:0} .ruler span:last-of-type{right:0}
.forme{background:var(--apricot-soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
.forme b{color:var(--apricot)}

/* Trink-Zähler */
.glasses{display:flex;gap:10px;flex-wrap:wrap}
.glass{width:38px;height:48px;border:2.5px solid var(--water);border-top-width:0;border-radius:0 0 10px 10px;background:transparent;position:relative;overflow:hidden;padding:0}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water);transition:height .2s}
.glass.full::after{height:72%}
.water-txt{color:var(--water);font-size:14px}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.fav{position:absolute;top:12px;right:14px;color:var(--heart);font-size:18px;line-height:1}
.hidden-chip{text-decoration:line-through;color:var(--muted)}

/* Rezeptliste */
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{position:relative;display:flex;flex-direction:column;gap:5px;padding:13px 36px 13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.rcard strong{font-size:16px}
.meta{display:flex;gap:4px 12px;font-size:13px;color:var(--muted);flex-wrap:wrap}

/* Ampel */
.search{position:relative}
.search input{padding-left:40px;font-size:17px;border:2px solid var(--sage);border-radius:14px;padding-block:12px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.frow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.frow .why{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}

/* Woche */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.day{display:flex;flex-direction:column;gap:2px}
.day h3{display:flex;justify-content:space-between;align-items:baseline}
.day.today{border-color:var(--sage)}
.pslot{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.pslot span{font-size:14px;color:var(--muted)}
.pslot select{padding:8px 10px;font-size:14.5px}
.shop-group{display:flex;flex-direction:column;gap:2px}
.shop-item{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.shop-item input{width:20px;height:20px;accent-color:var(--sage);flex:none}
.shop-item .amt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.shop-item.done .nm{text-decoration:line-through;color:var(--muted)}

/* Rezept-Blatt */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--shade)}
.sheet .box{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet ul,.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.ing{list-style:none;padding:0!important}
.ing li{display:grid;grid-template-columns:90px 1fr;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ing li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.safe{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14.5px}
.safe b{color:var(--warn)}
.addplan{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}
.disclaimer{font-size:12.5px;color:var(--muted);text-align:center;padding-top:4px}
@media (prefers-reduced-motion:no-preference){.sheet .box{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg>Heute</button>
  <button data-tab="lust"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Lust &amp; Hilfe</button>
  <button data-tab="ampel"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Darf ich?</button>
  <button data-tab="rezepte"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Rezepte</button>
  <button data-tab="woche"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Woche</button>
</div></nav>

<div id="sheet" class="sheet" hidden><div class="box" role="dialog" aria-modal="true" id="sheetBox"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   DATEN
   Mengen in Rezepten immer für 2 Portionen.
   Zutat: [Menge, Einheit, Name, Gruppe]
   Gruppen: o Obst & Gemüse, k Kühlregal, f Fleisch & Fisch, b Brot,
            v Vorrat, t Tiefkühl, g Gewürze & Grundvorrat
   ============================================================ */
const GROUPS = {o:"Obst & Gemüse", k:"Kühlregal", f:"Fleisch & Fisch", b:"Brot & Backwaren", v:"Vorrat", t:"Tiefkühl", g:"Gewürze & Grundvorrat"};
const TYPES = {f:"Frühstück", h:"Hauptgericht", s:"Snack"};

const RECIPES = [
 {id:"haferbrei", help:["verstopfung","kraempfe"], name:"Haferbrei mit Beeren und Leinsamen", type:"f", min:10,
  ing:[[100,"g","Haferflocken","v"],[400,"ml","Milch","k"],[150,"g","TK-Beeren","t"],[2,"EL","Leinsamen, geschrotet","v"],[1,"Stk","Banane","o"],[1,"Prise","Zimt","g"]],
  steps:["Haferflocken mit der Milch aufkochen und 3 Minuten quellen lassen.","TK-Beeren in einem kleinen Topf mindestens 2 Minuten sprudelnd kochen.","Banane in Scheiben schneiden. Brei mit Beeren, Banane, Leinsamen und Zimt anrichten."],
  safe:"TK-Beeren in der Schwangerschaft immer kurz durchkochen (Noroviren, Hepatitis A).",
  nut:["Ballaststoffe","Calcium","Magnesium","Eisen"]},
 {id:"ruehrei", name:"Rührei mit Spinat auf Vollkornbrot", type:"f", min:15,
  ing:[[4,"Stk","Eier","k"],[100,"g","Babyspinat","o"],[4,"Scheibe","Vollkornbrot","b"],[8,"Stk","Cherrytomaten","o"],[1,"TL","Rapsöl","g"],[1,"Prise","Jodsalz","g"]],
  steps:["Spinat gründlich waschen und in einer Pfanne mit dem Öl zusammenfallen lassen.","Eier verquirlen, salzen und zum Spinat geben.","Rühren, bis das Ei vollständig gestockt ist und nichts mehr feucht glänzt.","Mit Brot und Tomaten servieren."],
  safe:"Eier immer ganz durchgaren, kein weiches oder flüssiges Eigelb (Salmonellen).",
  nut:["Folsäure","Protein","Jod","Eisen"]},
 {id:"joghurtbowl", help:["kraempfe"], name:"Joghurt-Bowl mit Apfel und Kürbiskernen", type:"f", min:5,
  ing:[[400,"g","Naturjoghurt","k"],[1,"Stk","Apfel","o"],[2,"EL","Kürbiskerne","v"],[3,"EL","Haferflocken","v"],[1,"TL","Honig","v"]],
  steps:["Apfel waschen und klein schneiden.","Joghurt in zwei Schalen geben, Apfel, Haferflocken und Kürbiskerne darauf.","Mit etwas Honig süßen."],
  nut:["Calcium","Protein","Magnesium"]},
 {id:"kaesebrot", name:"Vollkornbrot mit Bergkäse und Paprika", type:"f", min:5,
  ing:[[4,"Scheibe","Vollkornbrot","b"],[2,"EL","Frischkäse","k"],[4,"Scheibe","Bergkäse (Hartkäse)","k"],[1,"Stk","Paprika, rot","o"]],
  steps:["Brot mit Frischkäse bestreichen und mit Käse belegen.","Paprika waschen, in Streifen schneiden und dazu essen."],
  tip:"Passt gut ab dem 2. Trimester für die zusätzlichen rund 250 kcal am Tag. Die Paprika liefert Vitamin C.",
  nut:["Calcium","Protein","Ballaststoffe"]},
 {id:"milchreis", help:["uebelkeit","sodbrennen"], name:"Milder Milchreis mit Apfel und Zimt", type:"f", min:30, tri:[1],
  ing:[[100,"g","Milchreis","v"],[500,"ml","Milch","k"],[1,"Stk","Apfel","o"],[1,"Prise","Zimt","g"],[1,"TL","Honig","v"]],
  steps:["Milch mit dem Reis aufkochen, dann bei kleiner Hitze 25 Minuten unter gelegentlichem Rühren quellen lassen.","Apfel reiben und unterheben.","Mit Zimt und etwas Honig abschmecken."],
  tip:"Mild und leicht verdaulich. Tut vielen gut, wenn im 1. Trimester die Übelkeit kommt.",
  nut:["Calcium"]},

 {id:"linsenbolo", help:["muedigkeit","verstopfung"], name:"Linsen-Bolognese mit Vollkornspaghetti", type:"h", min:35,
  ing:[[100,"g","Rote Linsen","v"],[200,"g","Vollkornspaghetti","v"],[1,"Stk","Zwiebel","o"],[1,"Stk","Möhre","o"],[1,"Stk","Paprika, rot","o"],[400,"g","Gehackte Tomaten (Dose)","v"],[1,"EL","Olivenöl","g"],[1,"TL","Oregano","g"],[1,"Prise","Jodsalz","g"]],
  steps:["Zwiebel, Möhre und Paprika fein würfeln und im Öl 5 Minuten anbraten.","Linsen, Tomaten und 200 ml Wasser dazugeben und 15 Minuten köcheln lassen.","In der Zeit die Spaghetti nach Packung kochen.","Soße mit Oregano und Jodsalz abschmecken."],
  tip:"Das Vitamin C aus der Paprika hilft, das Eisen aus den Linsen aufzunehmen.",
  nut:["Eisen","Folsäure","Ballaststoffe","Protein"]},
 {id:"ofenlachs", name:"Ofenlachs mit Brokkoli und Kartoffelspalten", type:"h", min:40, fish:true,
  ing:[[2,"Stk","Lachsfilet (je 125 g)","f"],[500,"g","Kartoffeln","o"],[300,"g","Brokkoli","o"],[1,"Stk","Zitrone","o"],[1,"EL","Rapsöl","g"],[1,"Prise","Jodsalz","g"]],
  steps:["Ofen auf 200 °C vorheizen. Kartoffeln in Spalten schneiden, mit Öl und Salz mischen und 15 Minuten backen.","Lachs und Brokkoli-Röschen dazulegen und weitere 15 bis 18 Minuten garen.","Der Lachs ist fertig, wenn er innen nicht mehr glasig ist und sich leicht zerteilen lässt.","Mit Zitronenspalten servieren."],
  safe:"Lachs vollständig durchgaren. Kein glasiger Kern, kein Räucher- oder Graved-Lachs.",

const SUPPLEMENTS = ["Folsäure","Jod","Eisen","Vitamin D","DHA"];
const SLOTS = [["f","Frühstück","f"],["m","Mittag","h"],["a","Abend","h"],["s","Snack","s"]];
const WEEKDAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

/* ============================================================
   SPEICHER (nur auf diesem Gerät)
   ============================================================ */
const KEY = "bauchgefuehl.v1";
let S = load();
function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  return normalize(s);
}
function normalize(s){
  if(!s || typeof s !== "object" || Array.isArray(s)) s = {};
  s = Object.assign({et:null, persons:2, supps:["Folsäure","Jod"], taken:{}, plan:null, shopDone:{}, tab:"heute", fav:[], hidden:null, water:{}}, s || {});
  // Voreinstellung: kein Lachs/Seelachs (nur Thunfisch). In den Einstellungen wieder einblendbar.
  if(!Array.isArray(s.hidden)) s.hidden = ["ofenlachs","seelachs"];
  if(!Array.isArray(s.allergies)) s.allergies = ["Walnuss","Kiwi"];
  ["supps","fav"].forEach(k => { if(!Array.isArray(s[k])) s[k] = []; });
  ["taken","shopDone","water"].forEach(k => { if(!s[k] || typeof s[k] !== "object") s[k] = {}; });
  if(s.et && !/^\d{4}-\d{2}-\d{2}$/.test(s.et)) s.et = null;
  return s;
}
// Allergie-Begriff auf den Wortstamm kürzen: „Walnüsse“ findet auch „Walnuss“
function stem(a){ a = norm(a.trim()); return a.length>4 ? a.replace(/(en|e|n|s)$/,"") : a; }
const allergyIn = text => { const t = norm(text); return S.allergies.find(a => stem(a) && t.includes(stem(a))); };
const allergic = r => r.ing.some(i => allergyIn(i[2]));
const visible = r => !S.hidden.includes(r.id) && !allergic(r);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============================================================
   DATUM & SSW
   ============================================================ */
function todayISO(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayNum(iso){ const [y,m,d]=iso.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); }
function isoFromNum(n){ const d=new Date(n*864e5); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
function fmtDate(iso){ const [y,m,d]=iso.split("-"); return d+"."+m+"."+y; }
function mondayNum(n){ const wd=(new Date(n*864e5).getUTCDay()+6)%7; return n-wd; }
function pregnancy(){
  if(!S.et) return null;
  const pd = 280 - (dayNum(S.et) - dayNum(todayISO()));
  const w = Math.floor(pd/7), d = pd - w*7;
  const tri = pd < 98 ? 1 : pd < 196 ? 2 : 3;
  return {pd, w, d, tri, left: dayNum(S.et) - dayNum(todayISO())};
}

/* ============================================================
   WOCHENPLAN
   ============================================================ */
const byId = Object.fromEntries(RECIPES.map(r=>[r.id,r]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function weighted(list){ // Favoriten kommen doppelt in den Topf
  return shuffle(list.flatMap(r => S.fav.includes(r.id) ? [r,r] : [r])).map(r=>r.id).filter((id,i,a)=>a.indexOf(id)===i);
}
function makePlan(startNum, tries){
  const P = pregnancy(); const tri = P ? P.tri : 2;
  const fits = r => visible(r) && (!r.tri || r.tri.includes(tri) || tri===1);
  const main = RECIPES.filter(r=>r.type==="h" && fits(r));
  // Fisch: bis zu 2× pro Woche, davon höchstens 1× Thunfisch
  const fishPick = []; let tuna = 0;
  for(const id of weighted(main.filter(r=>r.fish))){ const r=byId[id]; if(fishPick.length>=2) break; if(r.tuna){ if(tuna) continue; tuna++; } fishPick.push(id); }
  const other = weighted(main.filter(r=>!r.fish));
  const pool = []; while(pool.length < 14 - fishPick.length && other.length) pool.push(...other);
  const mains = shuffle(fishPick.concat(pool.slice(0, 14 - fishPick.length)));
  const brk = weighted(RECIPES.filter(r=>r.type==="f" && fits(r)));
  const snk = weighted(RECIPES.filter(r=>r.type==="s" && visible(r)));
  const at = (a,i) => a.length ? a[i % a.length] : null;
  const days = [];
  for(let i=0;i<7;i++) days.push({f: at(brk,i), m: mains[i*2]||null, a: mains[i*2+1]||null, s: at(snk,i)});
  // Kein Gericht zweimal am selben Tag: dann neu mischen
  if(days.some(d=>d.m && d.m===d.a) && (tries||0) < 50) return makePlan(startNum, (tries||0)+1);
  return {start: isoFromNum(startNum), days};
}
function ensurePlan(){
  const mon = mondayNum(dayNum(todayISO()));
  if(!S.plan || dayNum(S.plan.start) !== mon){ S.plan = makePlan(mon); S.shopDone = {}; save(); }
}
function todayIndex(){ return dayNum(todayISO()) - dayNum(S.plan.start); }

/* ============================================================
   EINKAUFSLISTE
   ============================================================ */
function fmtNum(x){ const r = Math.round(x*100)/100; return String(r).replace(".",","); }
function scaleAmount(q,u,factor){
  let v = q*factor;
  if(["Stk","Dose","Zehe","Scheibe","Bund","Blatt"].includes(u)) v = Math.ceil(v*2)/2;
  else if(u==="g"||u==="ml") v = Math.round(v/5)*5;
  return v;
}
// EL/TL werden mit g bzw. ml derselben Zutat zusammengezählt (ungefähre Umrechnung).
const SPOON = {ml:{EL:15,TL:5}, g:{EL:10,TL:4}};
function shoppingList(){
  const f = S.persons/2, byName = {};
  S.plan.days.forEach(d => ["f","m","a","s"].forEach(k => {
    const r = byId[d[k]]; if(!r) return;
    r.ing.forEach(([q,u,n,g]) => {
      const it = byName[n] = byName[n] || {n,g,units:{}};
      it.units[u] = (it.units[u]||0) + q*f;
    });
  }));
  const out = {};
  Object.values(byName).forEach(it => {
    const U = it.units;
    const base = U.ml!==undefined ? "ml" : U.g!==undefined ? "g" : null;
    if(base){ ["EL","TL"].forEach(sp => { if(U[sp]){ U[base] += U[sp]*SPOON[base][sp]; delete U[sp]; } }); }
    else if(U.EL!==undefined && U.TL!==undefined){ U.EL += U.TL/3; delete U.TL; }
    const parts = [];
    Object.entries(U).forEach(([u,q]) => {
      if(u==="Prise") return;
      q = scaleAmount(q,u,1);
      if(u==="EL"||u==="TL") q = Math.ceil(q*2)/2;
      if(u==="g" && q>=1000) parts.push(fmtNum(q/1000)+" kg");
      else if(u==="ml" && q>=1000) parts.push(fmtNum(q/1000)+" l");
      else parts.push(fmtNum(q)+" "+u);
    });
    (out[it.g] = out[it.g] || []).push({key:it.n, n:it.n, amt:parts.join(" + ")});
  });
  Object.values(out).forEach(a=>a.sort((x,y)=>x.n.localeCompare(y.n,"de")));
  return out;
}

  const gear = `<button class="iconbtn" data-act="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>`;
  const now = new Date();
  const hello = now.getHours()<11 ? "Guten Morgen" : now.getHours()<18 ? "Hallo" : "Guten Abend";
  let html = `<div class="head"><div><h1>${hello}</h1><p class="muted">${WEEKDAYS[(now.getDay()+6)%7]}, ${fmtDate(todayISO())}</p></div>${gear}</div>`;

  const T = TRIMESTERS[P.tri];
  const C = 2*Math.PI*42, frac = Math.max(0,Math.min(1,P.pd/280));
  let leftTxt;
  if(P.left > 0){ const lw=Math.floor(P.left/7), ld=P.left%7; leftTxt = `noch ${lw} Wochen${ld?` und ${ld} Tag${ld>1?"e":""}`:""} bis zum ET`; }
  else if(P.left === 0) leftTxt = "Heute ist der errechnete Termin";
  else leftTxt = `${-P.left} Tag${P.left<-1?"e":""} über dem ET`;
  html += `<section class="week" aria-label="Schwangerschaftswoche">

      <circle class="bar" cx="48" cy="48" r="42" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 48 48)"/>

  const di = todayIndex(), day = S.plan.days[di];
  html += `<section class="panel"><div class="head"><h2>Heute im Plan</h2><button class="btn ghost small" data-tab="woche">Woche</button></div><div class="meals">

  </div></section>`;

  const w = S.water[todayISO()] || 0;
  html += `<section class="panel"><div class="head" style="align-items:baseline"><h2>Getrunken</h2><span class="water-txt"><b>${fmtNum(w*0.25)} l</b> von 1,5 l</span></div>

  if(S.supps.length){
    const t = S.taken[todayISO()] || [];
    html += `<section class="view" style="gap:10px"><h2>Heute genommen</h2><div class="supp">${S.supps.map(s=>`<label><input type="checkbox" data-supp="${esc(s)}" ${t.includes(s)?"checked":""}>${esc(s)}</label>`).join("")}</div></section>`;
  }
  html += `<div class="tip"><b>Tipp für das ${T.name}:</b> ${esc(T.tip)}</div>`;
  return `<div class="view">${html}${disclaimer()}</div>`;

function viewWeekCard(P){
  const cur = Math.max(4, Math.min(40, P.w));
  const w = ui.week ? Math.max(4, Math.min(40, ui.week)) : cur;
  const [n, cmp, cm, g, dev, tip] = weekInfo(w);
  const bar = Math.max(1.5, cm/52*100);
  const weight = g >= 1000 ? fmtNum(Math.round(g/100)/10)+" kg" : g ? g+" g" : "unter 1 g";
  return `<section class="panel weekcard" aria-label="Deine Woche">
    <div class="wnav"><button class="iconbtn" data-week="${w-1}" ${w<=4?"disabled":""} aria-label="Vorige Woche">‹</button>
      <div class="wtitle"><h2>Deine Woche: SSW ${n}</h2><span class="small muted">${w===cur?"diese Woche":w<cur?`vor ${cur-w} Woche${cur-w>1?"n":""}`:`in ${w-cur} Woche${w-cur>1?"n":""}`}</span></div>
      <button class="iconbtn" data-week="${w+1}" ${w>=40?"disabled":""} aria-label="Nächste Woche">›</button></div>
    <b class="cmp">${esc(cmp)}</b>
    <div class="facts"><div><b>ca. ${fmtNum(cm)} cm</b>${n<20?"Scheitel bis Steiß":"Kopf bis Fuß"}</div><div><b>ca. ${weight}</b>Gewicht</div></div>
    <div class="ruler" aria-hidden="true"><i style="width:${bar.toFixed(1)}%"></i><span>0</span><span>50 cm</span></div>
    <p style="margin:0">${esc(dev)}</p>
    <div class="forme"><b>Für dich:</b> ${esc(tip)}</div>
    ${w!==cur?`<button class="btn ghost small" data-week="${cur}">Zurück zu dieser Woche</button>`:""}
  </section>`;
}

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss"); }
const escRe = x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function searchFoods(raw){
  const q = norm(raw.trim()).replace(/\s+/g," ");
  if(!q) return null;
  const allergy = allergyIn(q);
  const mod = RULES.find(r => r.mod && r.re.test(q) && !(r.unless && r.unless.test(q)));
  const startWord = new RegExp("(^|[\\s,(/-])"+escRe(q));
  const matches = FOODS.map(f => {
    const n = norm(f[0]), syn = norm(f[3]||""); let sc = 0;
    if(new RegExp("^"+escRe(q)+"($|[^a-z])").test(n)) sc = 5.5;
    else if(n.startsWith(q)) sc = 5;
    else if(startWord.test(n)) sc = 4;
    else if(n.includes(q)) sc = 3;
    else if(startWord.test(syn)) sc = 2.5;
    else if(syn.includes(q)) sc = 2;
    else { // Suchbegriff enthält einen bekannten Begriff, z. B. „Kalbsleberwurst“ → „Leberwurst“
      const words = (n.replace(/[(),/.]/g," ")+" "+syn).split(/\s+/).filter(w=>w.length>=4);
      const hits = [...new Set(words.filter(w=>q.includes(w)))];
      const len = hits.reduce((t,w)=>t+w.length,0);
      if(len) sc = 1 + Math.min(len,20)/20;
    }
    // Rohmilch-Varianten nur nach vorn, wenn danach gesucht wird
    if(sc && /rohmilch/.test(n) && !/rohmilch/.test(q)) sc -= 0.4;
    return {f, sc};
  }).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc || STRICT[y.f[1]]-STRICT[x.f[1]] || x.f[0].length-y.f[0].length).map(x=>x.f);
  const rule = matches.length ? null : RULES.find(r => !r.mod && r.re.test(q));
  const bestAllergy = !allergy && matches[0] ? allergyIn(matches[0][0]) : null;
  return {q, allergy: allergy || bestAllergy, mod, matches, rule};
}
const VERDICT = {ok:"Unbedenklich", warn:"Mit Vorsicht", no:"Meiden"};
const STRICT = {ok:0, warn:1, no:2}; // bei gleichem Treffer zuerst die vorsichtigere Antwort
function bigCard(s, verdict, title, why, note){
  return `<section class="answer a-${s}" aria-live="polite"><span class="verdict">${esc(verdict)}</span>${title?`<b>${esc(title)}</b>`:""}<span>${esc(why)}</span>${note?`<small>${esc(note)}</small>`:""}</section>`;
}
function smallRow(f){ return `<div class="frow"><div>${esc(f[0])}<span class="why">${esc(f[2])}</span></div><span class="pill p-${f[1]}">${VERDICT[f[1]]}</span></div>`; }
function foodResults(){
  const R = searchFoods(ui.q);
  if(!R) return `<p style="margin:0">Tippe ein Lebensmittel, ein Gericht oder ein Getränk ein. Rund ${FOODS.length} Einträge sind hinterlegt. Steht etwas nicht drin, antwortet die App nach den allgemeinen Regeln.</p>
    <div class="chips">${["Brie","Salami","Räucherlachs","Sushi","Kaffee","Tiramisu","Feta","Thunfisch","Softeis","Leberwurst"].map(x=>`<button class="chip" data-example="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
  let out = "";
  if(R.allergy) out += bigCard("no","Deine Allergie",`Eingetragen: ${R.allergy}`,"Meiden. Bei Fertigprodukten immer die Zutatenliste prüfen, auch auf „Kann Spuren enthalten“.");
  let rest = R.matches;
  if(R.mod){ out += bigCard(R.mod.s, VERDICT[R.mod.s], R.mod.title, R.mod.why, "Antwort nach Regel"); }
  else if(rest.length && !R.allergy){ const f = rest[0]; out += bigCard(f[1], VERDICT[f[1]], f[0], f[2]); rest = rest.slice(1); }
  else if(R.allergy){ /* Allergie-Karte reicht als Antwort */ }
  else if(R.rule){ out += bigCard(R.rule.s, VERDICT[R.rule.s], ui.q.trim(), R.rule.why, `Nicht in der Liste. Antwort nach Regel „${R.rule.title}“`); }
  else out += bigCard("info","Keine Einschränkung bekannt", ui.q.trim(), "Nicht in der Liste und keine Regel trifft zu. Wie immer gilt: gründlich waschen, Fleisch, Fisch und Eier durchgaren, Käse aus pasteurisierter Milch.", "Im Zweifel Hebamme oder Ärztin fragen.");
  if(rest.length) out += `<h3 style="margin-top:4px">${R.mod?"Passende Einträge":"Ähnliche Einträge"}</h3><div class="rlist">${rest.slice(0,7).map(smallRow).join("")}</div>`;
  return out;
}

// .txt statt .json: Android teilt nur bestimmte Dateitypen, Textdateien gehören dazu.
function backupFile(){
  const data = Object.assign({}, S); delete data.tab;
  const text = JSON.stringify({app:"bauchgefuehl", version:1, created:todayISO(), data}, null, 1);
  const name = `bauchgefuehl-sicherung-${todayISO()}.txt`;
  return new File([text], name, {type:"text/plain"});
}
async function doBackup(){
  const file = backupFile();
  const done = how => { S.lastBackup = todayISO(); save(); const el=document.getElementById("lastBackup"); if(el) el.textContent=fmtDate(S.lastBackup); toast(how); };
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bauchgefühl-Sicherung", text:"Sicherung der Bauchgefühl-App vom "+fmtDate(todayISO())});
      done("Sicherung geteilt"); return;
    }
  }catch(e){
    if(e && e.name === "AbortError"){ toast("Sicherung abgebrochen"); return; }
  }
  // Ohne Teilen-Menü: als Datei speichern
  try{
    const url = URL.createObjectURL(file), a = document.createElement("a");
    a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    done("Sicherung als Datei gespeichert: "+file.name);
  }catch(e){ toast("Sichern ging nicht. Bitte nochmal versuchen."); }
}
let pendingRestore = null;
function readRestore(file){
  const box = document.getElementById("restoreConfirm");
  const r = new FileReader();
  r.onload = () => {
    let obj = null; try{ obj = JSON.parse(r.result); }catch(e){}
    if(!obj || obj.app !== "bauchgefuehl" || !obj.data){ pendingRestore=null; box.hidden=false; box.innerHTML=`<p class="safe" style="margin:0">Diese Datei ist keine Bauchgefühl-Sicherung. Bitte die Datei „bauchgefuehl-sicherung-….txt“ wählen.</p>`; return; }
    pendingRestore = obj;
    const d = obj.data;
    box.hidden = false;
    box.innerHTML = `<div class="tip"><b>Sicherung vom ${esc(fmtDate(obj.created||todayISO()))}</b><br>
      Termin: ${d.et?esc(fmtDate(d.et)):"keiner"} · Favoriten: ${(d.fav||[]).length} · Allergien: ${esc((d.allergies||[]).join(", ")||"keine")}</div>
      <p style="margin:0">Wiederherstellen ersetzt alle Daten auf diesem Handy.</p>
      <div class="btnrow"><button class="btn" data-act="restoreYes">Ja, wiederherstellen</button><button class="btn ghost" data-act="restoreNo">Abbrechen</button></div>`;
  };
  r.onerror = () => toast("Die Datei ließ sich nicht lesen.");
  r.readAsText(file);
}

  if(e.target === $sheet){ closeSheet(); return; }
  if(!b) return;
  if(b.dataset.tab){ if($sheet.hidden===false) closeSheet(); setTab(b.dataset.tab); return; }
  if(b.dataset.recipe){ openRecipe(b.dataset.recipe); return; }
  if(b.dataset.crave){ ui.craving=b.dataset.crave; render(); return; }
  if(b.dataset.rtype){ ui.rType=b.dataset.rtype; render(); return; }
  if(b.dataset.wtab){ ui.wTab=b.dataset.wtab; render(); return; }
  if(b.dataset.week){ ui.week=+b.dataset.week; render(); const c=document.querySelector(".weekcard"); if(c) c.scrollIntoView({block:"nearest"}); return; }
  if(b.dataset.example){ ui.q=b.dataset.example; const i=document.getElementById("q"); if(i) i.value=ui.q; document.getElementById("flist").innerHTML=foodResults(); return; }
  if(b.dataset.ltab){ ui.lTab=b.dataset.ltab; render(); return; }
  if(b.dataset.complaint){ ui.complaint=b.dataset.complaint; render(); return; }
  if(b.dataset.glass){ const k=todayISO(), n=+b.dataset.glass, cur=S.water[k]||0; S.water={[k]: n===cur ? n-1 : n}; save(); render(); return; }
  if(b.dataset.unallergy){ S.allergies=S.allergies.filter(x=>x!==b.dataset.unallergy); save(); openSettings(); render(); return; }
  if(b.dataset.unhide){ S.hidden=S.hidden.filter(x=>x!==b.dataset.unhide); save(); openSettings(); render(); return; }
  const a = b.dataset.act;
  if(a==="close") closeSheet();
  else if(a==="settings") openSettings();
  else if(a==="sources") openSources();
  else if(a==="saveEt"){
    const et = document.getElementById("et").value, lmp = document.getElementById("lmp").value;
    let v = et || (lmp ? isoFromNum(dayNum(lmp)+280) : "");
    if(!v){ toast("Bitte ein Datum eintragen."); return; }
    const diff = dayNum(v) - dayNum(todayISO());
    if(diff > 300 || diff < -30){ toast("Das Datum liegt zu weit weg. Bitte prüfen."); return; }
    S.et = v; save(); closeSheet(); render(); toast("Termin gespeichert: "+fmtDate(v));
  }
  else if(a==="fav"){ const id=b.dataset.id; S.fav = S.fav.includes(id) ? S.fav.filter(x=>x!==id) : S.fav.concat(id); save(); openRecipe(id); render(); toast(S.fav.includes(id)?"Als Lieblingsrezept gemerkt":"Aus Favoriten entfernt"); }
  else if(a==="hide"){ const id=b.dataset.id; const on=!S.hidden.includes(id); S.hidden = on ? S.hidden.concat(id) : S.hidden.filter(x=>x!==id); save(); closeSheet(); render(); toast(on?"Wird nicht mehr vorgeschlagen. Rückgängig in den Einstellungen.":"Wird wieder vorgeschlagen"); }
  else if(a==="addAllergy"){ const v=(document.getElementById("newAllergy").value||"").trim(); if(!v){ toast("Bitte eine Allergie eintippen."); return; } if(!S.allergies.some(x=>norm(x)===norm(v))) S.allergies=S.allergies.concat(v); save(); openSettings(); render(); toast(`„${v}“ als Allergie eingetragen`); }
  else if(a==="newplan"){ S.plan = makePlan(dayNum(S.plan.start)); S.shopDone={}; save(); render(); toast("Neuer Wochenplan erstellt"); }
  else if(a==="addplan"){
    const d=+document.getElementById("apDay").value, s=document.getElementById("apSlot").value;
    S.plan.days[d][s]=b.dataset.id; save(); closeSheet(); render(); toast(`Eingetragen: ${WEEKDAYS[d]}, ${SLOTS.find(x=>x[0]===s)[1]}`);
  }
  else if(a==="clearshop"){ S.shopDone={}; save(); render(); }
  else if(a==="copyshop"){
    const L=shoppingList(); const txt=Object.keys(GROUPS).filter(g=>L[g]).map(g=>GROUPS[g]+":\n"+L[g].filter(i=>!S.shopDone[i.key]).map(i=>"- "+(i.amt?i.amt+" ":"")+i.n).join("\n")).join("\n\n");
    const done=()=>toast("Einkaufsliste kopiert");
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>toast("Kopieren ging nicht. Bitte lange auf den Text drücken."));
    else toast("Kopieren wird hier nicht unterstützt.");
  }
  else if(a==="backup"){ doBackup(); }
  else if(a==="restore"){ const i=document.getElementById("restoreFile"); i.value=""; i.click(); }
  else if(a==="restoreNo"){ pendingRestore=null; document.getElementById("restoreConfirm").hidden=true; }
  else if(a==="restoreYes" && pendingRestore){ const keepTab=S.tab; S=normalize(pendingRestore.data); S.tab=keepTab; pendingRestore=null; save(); closeSheet(); render(); toast("Sicherung wiederhergestellt"); }
  else if(a==="reset"){ document.getElementById("resetConfirm").hidden=false; }
  else if(a==="resetNo"){ document.getElementById("resetConfirm").hidden=true; }
  else if(a==="resetYes"){ try{localStorage.removeItem(KEY);}catch(e){} S=load(); closeSheet(); setTab("heute"); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.supp){ const k=todayISO(); const l=new Set(S.taken[k]||[]); t.checked?l.add(t.dataset.supp):l.delete(t.dataset.supp); S.taken={[k]:[...l]}; save(); }
  else if(t.dataset.suppcfg){ const l=new Set(S.supps); t.checked?l.add(t.dataset.suppcfg):l.delete(t.dataset.suppcfg); S.supps=SUPPLEMENTS.filter(s=>l.has(s)); save(); render(); }
  else if(t.dataset.shop){ if(t.checked) S.shopDone[t.dataset.shop]=1; else delete S.shopDone[t.dataset.shop]; save(); t.closest(".shop-item").classList.toggle("done",t.checked); }
  else if(t.dataset.slot){ S.plan.days[+t.dataset.day][t.dataset.slot]=t.value||null; save(); }
  else if(t.id==="restoreFile" && t.files && t.files[0]){ readRestore(t.files[0]); }
  else if(t.id==="persons"){ S.persons=+t.value; save(); render(); }
  else if(t.id==="rnut"){ ui.rNut=t.value||null; render(); }
  else if(t.id==="lmp" && t.value){ const et=document.getElementById("et"); if(et) et.value=isoFromNum(dayNum(t.value)+280); }
});
document.addEventListener("input", e => { if(e.target.id==="q"){ ui.q=e.target.value; document.getElementById("flist").innerHTML=foodResults(); } });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$sheet.hidden) closeSheet(); });

setTab(S.tab || "heute");

/* Offline-Nutzung */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
